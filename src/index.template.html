<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#100e0c" />
  <meta name="apple-mobile-web-app-title" content="/*APP_NAME*/" />
  <meta name="description" content="A simple guitar pedalboard in the browser: drive, modulation, filter, delay, and reverb." />
  <title>/*APP_NAME*/</title>
  <style>/*CSS*/</style>
</head>
<body>
  <main class="wrap">
    <header class="top">
      <div class="title-row">
        <h1 id="appTitle">/*APP_NAME*/</h1>
      </div>
      <p id="tip" class="tip">Wear headphones if you use the phone mic, so the sound doesn't feed back.</p>
      <div class="controls">
        <div>
          <div id="player">
            <button id="playNote" type="button">Play note</button>
            <div class="octave-row">
              <button type="button" id="octaveDown" aria-label="Octave down">−</button>
              <p id="noteReadout" class="note-readout">C3</p>
              <button type="button" id="octaveUp" aria-label="Octave up">+</button>
            </div>
            <div id="notes" class="notes" role="group" aria-label="Note"></div>
            <div id="sounds" class="sounds" role="group" aria-label="Sound"></div>
            <button type="button" id="repeat" aria-pressed="false"></button>
            <button type="button" id="useGuitar" class="quiet">Use my guitar</button>
          </div>
          <div id="guitarBox" hidden>
            <button type="button" id="useGuitarNow">Use my guitar</button>
            <label class="device-label" for="device">Input</label>
            <select id="device" aria-label="Audio input"></select>
            <button type="button" id="playNotes" class="quiet">Play notes</button>
          </div>
          <p id="status" role="status"></p>
          <p id="runaway" class="runaway" hidden>
            <span>Muted: runaway sound</span>
            <button type="button" id="unmute">Unmute</button>
          </p>
        </div>
        <div class="levels">
          <div class="meter-block">
            <span>Level</span>
            <div id="meter" class="meter" role="meter" aria-label="Input level" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
              <div id="meterFill"></div>
            </div>
          </div>
          <div id="inputSlot"></div>
          <div id="masterSlot"></div>
        </div>
      </div>
    </header>
    <div id="presets" class="presets" role="group" aria-label="Presets"></div>
    <section class="board-wrap" aria-label="Pedalboard">
      <p id="chainLabel" class="chain"></p>
      <div id="board" class="board"></div>
      <div id="addRow" class="add-row"></div>
    </section>
  </main>
  <script type="module">
    const WORKLET_URL = "/*WORKLET_URL*/";
    /*JS*/
  </script>
</body>
</html>
