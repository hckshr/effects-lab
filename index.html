<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#100e0c" />
  <meta name="apple-mobile-web-app-title" content="Effects Lab" />
  <meta name="description" content="A simple guitar pedalboard in the browser: drive, modulation, filter, delay, and reverb." />
  <title>Effects Lab</title>
  <style>:root {
  color-scheme: dark;
  --bg: #100e0c;
  --cream: #f3ead7;
  --muted: #cbbfaa;
  --gold: #e4c27a;
  --ink: #1b140e;
}

* { box-sizing: border-box; }

html, body { margin: 0; }

body {
  background:
    radial-gradient(1200px 500px at 50% -10%, rgba(228, 194, 122, 0.08), transparent 50%),
    var(--bg);
  color: var(--cream);
  font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif;
  font-size: 16px;
  line-height: 1.35;
  min-height: 100%;
}

button, select { font: inherit; color: inherit; }

button { cursor: pointer; }

:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 2px;
}

.wrap {
  width: min(1120px, 100%);
  margin: 0 auto;
  padding: 16px 14px calc(24px + env(safe-area-inset-bottom));
}

.title-row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
}

h1 {
  margin: 0;
  font-size: 1.85rem;
  font-weight: 700;
  letter-spacing: -0.03em;
}

.tip {
  margin: 8px 0 14px;
  color: var(--muted);
  max-width: 40rem;
}

#playNote, #useGuitarNow {
  width: 100%;
  min-height: 76px;
  border: 0;
  border-radius: 14px;
  background: var(--cream);
  color: var(--ink);
  font-size: 1.45rem;
  font-weight: 750;
  letter-spacing: 0.04em;
  box-shadow: 0 8px 0 #6d6456;
  touch-action: none;
}

#playNote:active, #playNote.is-down, #useGuitarNow:active {
  transform: translateY(2px);
  box-shadow: 0 6px 0 #6d6456;
}

.octave-row {
  display: grid;
  grid-template-columns: 52px minmax(0, 1fr) 52px;
  gap: 8px;
  align-items: center;
  margin-top: 12px;
}

#octaveDown, #octaveUp {
  min-height: 64px;
  border-radius: 12px;
  border: 1px solid rgba(243, 234, 215, 0.2);
  background: #1a1815;
  font-size: 1.6rem;
}

#octaveDown:disabled, #octaveUp:disabled { opacity: 0.35; }

.note-readout {
  margin: 0;
  text-align: center;
  font-size: 1.35rem;
  font-weight: 700;
  letter-spacing: 0.04em;
}

.notes, .sounds {
  display: grid;
  gap: 6px;
}

.notes { grid-template-columns: repeat(6, minmax(0, 1fr)); margin-top: 8px; }
.sounds { grid-template-columns: repeat(4, minmax(0, 1fr)); margin-top: 10px; }

.notes button, .sounds button, #repeat, .quiet {
  min-height: 44px;
  border-radius: 10px;
  border: 1px solid rgba(243, 234, 215, 0.16);
  background: #1a1815;
}

.notes button { font-size: 0.85rem; padding: 0; }
.notes button.on, .sounds button.on, #repeat.on {
  background: var(--cream);
  color: var(--ink);
  border-color: transparent;
}

#repeat, .quiet { width: 100%; margin-top: 8px; }
.quiet { color: var(--muted); background: transparent; }

#status {
  min-height: 1.3em;
  margin: 8px 0 0;
  color: var(--muted);
  font-size: 0.92rem;
}

.presets button, .add-row button, .chip, .nudge, .remove, .more-btn, .tap, .notes button, .sounds button, #repeat, .quiet, #octaveDown, #octaveUp {
  -webkit-tap-highlight-color: transparent;
}

.device-label {
  display: block;
  margin-top: 12px;
  color: var(--muted);
  font-size: 0.82rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

select {
  width: 100%;
  min-height: 48px;
  margin-top: 6px;
  padding: 0 12px;
  font-size: 16px;
  border-radius: 12px;
  border: 1px solid rgba(243, 234, 215, 0.16);
  background: #1a1815;
}

select:disabled { opacity: 0.45; }

.levels {
  display: grid;
  grid-template-columns: 84px 84px;
  justify-content: start;
  gap: 8px 12px;
  align-items: end;
  margin-top: 16px;
}

.meter-block { grid-column: 1 / -1; min-width: 0; }

#inputSlot, #masterSlot { width: 84px; }

.meter-block span, .knob-label {
  display: block;
  color: var(--muted);
  font-size: 0.75rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  text-align: center;
}

.meter-block span { text-align: left; margin-bottom: 6px; }

.meter {
  height: 26px;
  border-radius: 999px;
  background: #6a5d4c;
  border: 1px solid rgba(228, 194, 122, 0.45);
  overflow: hidden;
  box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.55);
}

#meterFill {
  width: 0;
  height: 100%;
  background: #8ee0a8;
  border-radius: inherit;
}

#meterFill[data-hot="warm"] { background: #e0b15a; }
#meterFill[data-hot="hot"] { background: #e15b4c; }

.presets {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 14px 0 4px;
  margin: 0;
}

.presets button {
  flex: 0 0 auto;
  min-height: 40px;
  padding: 0 14px;
  border-radius: 999px;
  border: 1px solid rgba(243, 234, 215, 0.16);
  background: #1a1815;
}

.presets button.on {
  background: var(--cream);
  color: var(--ink);
  border-color: transparent;
}

.board-wrap {
  margin-top: 8px;
  padding: 14px 12px 12px;
  border-radius: 18px;
  background:
    linear-gradient(180deg, rgba(255, 255, 255, 0.04), transparent 28%),
    #1a1714;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05), 0 16px 40px rgba(0, 0, 0, 0.28);
}

.chain {
  margin: 0 0 12px;
  color: var(--cream);
}

.board {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.empty, .add-all { color: var(--muted); margin: 8px 4px; }

.pedal {
  position: relative;
  display: flex;
  flex-direction: column;
  background: #121110;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35);
  user-select: none;
  touch-action: pan-y;
}

.pedal.engaged { box-shadow: 0 0 0 1px rgba(228, 194, 122, 0.45), 0 12px 28px rgba(0, 0, 0, 0.35); }

.pedal-top {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 76px;
  padding: 10px 12px 10px 16px;
  cursor: grab;
  touch-action: none;
}

.pedal-top:active { cursor: grabbing; }

.c-drive .pedal-top { background: linear-gradient(180deg, #a03b36, #7c2c28); }
.c-mod .pedal-top { background: linear-gradient(180deg, #3a62a8, #27457a); }
.c-filter .pedal-top { background: linear-gradient(180deg, #c4842e, #8d5d18); }
.c-delay .pedal-top { background: linear-gradient(180deg, #2a8a5a, #17643e); }
.c-reverb .pedal-top { background: linear-gradient(180deg, #267887, #164852); }

.drag {
  color: rgba(255, 255, 255, 0.7);
  letter-spacing: -0.2em;
  font-size: 0.85rem;
}

.pedal-top h2 {
  flex: 1;
  margin: 0;
  font-size: 1rem;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.stomp {
  position: relative;
  width: 60px;
  height: 60px;
  flex: 0 0 60px;
  border: 0;
  border-radius: 50%;
  background: radial-gradient(circle at 40% 32%, #6a655c, #1a1916 68%);
  box-shadow: inset 0 2px 2px rgba(255, 255, 255, 0.22), 0 3px 0 #0b0a09;
}

.stomp.on {
  box-shadow: 0 0 0 3px rgba(255, 92, 61, 0.7), inset 0 2px 2px rgba(255, 255, 255, 0.22), 0 3px 0 #0b0a09;
}

.led {
  position: absolute;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  left: 50%;
  top: 9px;
  transform: translateX(-50%);
  background: #3a221c;
}

.stomp.on .led {
  background: #ff5a3c;
  box-shadow: 0 0 8px #ff5a3c;
}

.face { padding: 12px 10px 4px; }

.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 10px;
}

.chip {
  min-height: 34px;
  padding: 0 10px;
  border-radius: 999px;
  border: 1px solid rgba(243, 234, 215, 0.18);
  background: transparent;
  color: var(--cream);
  font-size: 0.8rem;
}

.chip.on {
  background: var(--cream);
  color: var(--ink);
  border-color: transparent;
}

.knobs {
  display: grid;
  gap: 6px;
  justify-items: center;
}

.knobs-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.knobs-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.knobs-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.knob {
  width: 100%;
  max-width: 92px;
  text-align: center;
  touch-action: none;
}

.knob-ring {
  width: 68px;
  height: 68px;
  margin: 0 auto;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: conic-gradient(from 225deg,
    var(--gold) 0deg,
    var(--gold) calc(var(--p, 0) * 270deg),
    rgba(255, 255, 255, 0.1) calc(var(--p, 0) * 270deg),
    rgba(255, 255, 255, 0.1) 270deg,
    transparent 270deg);
}

.knob-dial {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  position: relative;
  background: radial-gradient(circle at 38% 30%, #6e675f, #221f1c 64%, #10100e);
  box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.28), 0 2px 4px rgba(0, 0, 0, 0.45);
  transform: rotate(calc(-135deg + var(--p, 0) * 270deg));
}

.pointer {
  position: absolute;
  left: 50%;
  top: 6px;
  width: 3px;
  height: 15px;
  margin-left: -1.5px;
  border-radius: 2px;
  background: var(--cream);
}

.knob-value {
  margin-top: 4px;
  font-variant-numeric: tabular-nums;
  font-size: 0.78rem;
  min-height: 1.1em;
}

.tap {
  margin-top: 4px;
  min-height: 32px;
  width: 100%;
  border-radius: 8px;
  border: 1px solid rgba(243, 234, 215, 0.2);
  background: #1c1a17;
}

.more-panel { margin-top: 8px; }

.pedal-foot {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 4px 8px 12px;
  margin-top: auto;
}

.more-btn, .remove {
  min-height: 40px;
  padding: 0 8px;
  border: 0;
  background: transparent;
  color: var(--muted);
}

.nudges {
  display: flex;
  gap: 6px;
  margin-left: auto;
}

.nudge {
  width: 42px;
  height: 42px;
  border-radius: 10px;
  border: 1px solid rgba(243, 234, 215, 0.28);
  background: #2a2722;
  display: grid;
  place-items: center;
  padding: 0;
}

.chev {
  width: 9px;
  height: 9px;
  border-top: 2px solid var(--cream);
  border-right: 2px solid var(--cream);
  display: block;
}

.nudge[data-dir="-1"] .chev { transform: rotate(-45deg); }
.nudge[data-dir="1"] .chev { transform: rotate(135deg); }
.board.horizontal .nudge[data-dir="-1"] .chev { transform: rotate(-135deg); }
.board.horizontal .nudge[data-dir="1"] .chev { transform: rotate(45deg); }

.nudge:disabled { opacity: 0.28; }

.add-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 12px;
}

.add-row button {
  min-height: 42px;
  padding: 0 12px;
  border-radius: 999px;
  border: 1px dashed rgba(243, 234, 215, 0.28);
  background: transparent;
}

.screw {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #f4efe4, #6a655c 46%, #262421 74%);
  z-index: 2;
  pointer-events: none;
}

.s1 { top: 8px; left: 8px; }
.s2 { bottom: 8px; left: 8px; }
.s3 { bottom: 8px; right: 8px; }

@media (min-width: 900px) {
  .controls {
    display: grid;
    grid-template-columns: minmax(0, 1.15fr) minmax(280px, 0.85fr);
    gap: 22px;
    align-items: end;
  }

  .levels { margin-top: 0; justify-content: end; }

  .board {
    flex-direction: row;
    align-items: stretch;
    overflow-x: auto;
    padding-bottom: 6px;
  }

  .pedal { flex: 0 0 280px; width: 280px; }
}

@media (max-width: 360px) {
  .knob-ring { width: 58px; height: 58px; }
  .knob-dial { width: 44px; height: 44px; }
  h1 { font-size: 1.55rem; }
}
</style>

export const NOTE_NAMES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
export const TEST_SOUNDS = ["pluck", "chord", "tone", "loop"];
export const TEST_SOUND_LABELS = { pluck: "Pluck", chord: "Chord", tone: "Tone", loop: "Loop" };

export function defaultPlayer() {
  return { note: "C", octave: 3, sound: "pluck", repeat: false };
}

export function sanitizePlayer(raw) {
  const player = defaultPlayer();
  if (!raw || typeof raw !== "object") return player;
  if (NOTE_NAMES.includes(raw.note)) player.note = raw.note;
  const oct = Number(raw.octave);
  if (Number.isFinite(oct)) player.octave = clamp(Math.round(oct), 2, 5);
  if (TEST_SOUNDS.includes(raw.sound)) player.sound = raw.sound;
  player.repeat = !!raw.repeat;
  return player;
}

export function noteFrequency(name, octave) {
  const index = NOTE_NAMES.indexOf(name);
  const midi = 12 * (octave + 1) + (index < 0 ? 0 : index);
  return 440 * Math.pow(2, (midi - 69) / 12);
}

export function majorChordFrequencies(rootHz) {
  return [0, 4, 7, 12].map((semitone) => rootHz * Math.pow(2, semitone / 12));
}

export function clamp(x, a, b) {
  if (x < a) return a;
  if (x > b) return b;
  return x;
}

export function clamp01(x) {
  return clamp(x, 0, 1);
}

export function logMap(k, min, max) {
  return min * Math.pow(max / min, clamp01(k));
}

export function logUnmap(value, min, max) {
  const v = clamp(value, min, max);
  return Math.log(v / min) / Math.log(max / min);
}

export function knobFromDelaySeconds(sec) {
  return logUnmap(sec, DELAY_MIN, DELAY_MAX);
}

export function reverbT60(k) {
  return logMap(k, 0.25, 8);
}

export function reverbCutoff(k) {
  return logMap(k, 900, 12000);
}

export function storageKeyFor(name) {
  return String(name).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") + ":v1";
}

export function validType(id, type) {
  return (TYPES[id] || []).includes(type);
}

export function reverbTypeIndex(type) {
  const i = TYPES.reverb.indexOf(type);
  return i < 0 ? 0 : i;
}

export function mapParam(pedal, param, knob, type) {
  const k = clamp01(Number.isFinite(knob) ? knob : 0);
  const key = pedal + "." + param;
  if (key === "drive.gain") return 1 + k * 24;
  if (key === "drive.tone") return logMap(k, 500, 6200);
  if (key === "drive.level") return k * 1.5;
  if (key === "drive.mix" || key === "drive.fuzz") return k;
  if (key === "mod.rate") {
    const range = MOD_RATE[type] || MOD_RATE.chorus;
    return logMap(k, range[0], range[1]);
  }
  if (key === "mod.depth") {
    if (type === "flanger") return 0.00025 + k * 0.0026;
    if (type === "phaser") return 100 + k * 500;
    if (type === "tremolo") return k;
    if (type === "vibrato") return 0.0006 + k * 0.0032;
    return 0.0008 + k * 0.0052;
  }
  if (key === "mod.mix" || key === "mod.width") return k;
  if (key === "mod.color") {
    if (type === "flanger") return k * MAX_FLANGER_FEEDBACK;
    if (type === "phaser") return k * MAX_PHASER_FEEDBACK;
    if (type === "tremolo") return k;
    return logMap(k, 800, 9000);
  }
  if (key === "filter.freq") {
    if (type === "wah") return logMap(k, 200, 480);
    if (type === "highpass") return logMap(k, 50, 2800);
    return logMap(k, 180, 7800);
  }
  if (key === "filter.range") return logMap(k, 700, 3400);
  if (key === "filter.resonance") return type === "wah" ? 0.9 + k * 7.5 : 0.5 + k * 3.2;
  if (key === "filter.depth") return k;
  if (key === "filter.rate") return type === "wah" ? logMap(k, 0.004, 0.07) : logMap(k, 0.06, 6);
  if (key === "filter.release") return logMap(k, 0.04, 0.55);
  if (key === "filter.mix") return k;
  if (key === "delay.time") return logMap(k, DELAY_MIN, DELAY_MAX);
  if (key === "delay.feedback") return k * MAX_DELAY_FEEDBACK;
  if (key === "delay.mix") return k;
  if (key === "delay.tone") return logMap(k, 700, 6800);
  if (key === "delay.modDepth") return k * 0.004;
  if (key === "delay.modRate") return logMap(k, 0.12, 4);
  if (key === "delay.lowCut") return logMap(k, 40, 420);
  if (key === "reverb.decay") return reverbT60(k);
  if (key === "reverb.tone") return reverbCutoff(k);
  if (key === "reverb.predelay") return k * 0.12;
  if (key === "reverb.size") return 0.7 + k * 0.65;
  if (key === "reverb.mix" || key === "reverb.width" || key === "reverb.mod") return k;
  return k;
}

function hzText(n) {
  if (n < 10) return n.toFixed(2) + " Hz";
  if (n < 100) return n.toFixed(1) + " Hz";
  return Math.round(n) + " Hz";
}

function msText(sec) {
  return Math.round(sec * 1000) + " ms";
}

function pctText(k) {
  return Math.round(clamp01(k) * 100) + "%";
}

export function formatParam(pedal, param, knob, type) {
  const v = mapParam(pedal, param, knob, type);
  if (pedal === "drive" && param === "gain") {
    const db = 20 * Math.log10(Math.max(1e-4, v));
    return (db >= 0 ? "+" : "") + db.toFixed(1) + " dB";
  }
  if (pedal === "drive" && param === "tone") return hzText(v);
  if (pedal === "drive" && param === "level") return pctText(knob);
  if (pedal === "mod" && param === "rate") return hzText(v);
  if (pedal === "mod" && param === "depth" && type === "phaser") return hzText(v);
  if (pedal === "mod" && param === "depth" && type === "tremolo") return pctText(v);
  if (pedal === "mod" && param === "depth") return (v * 1000).toFixed(1) + " ms";
  if (pedal === "mod" && param === "color" && (type === "phaser" || type === "flanger" || type === "tremolo")) return pctText(knob);
  if (pedal === "mod" && param === "color") return hzText(v);
  if (pedal === "filter" && param === "freq") return hzText(v);
  if (pedal === "filter" && param === "rate" && type === "wah") return msText(v);
  if (pedal === "filter" && param === "rate") return hzText(v);
  if (pedal === "filter" && param === "release") return msText(v);
  if (pedal === "filter" && param === "resonance") return v.toFixed(1);
  if (pedal === "delay" && param === "time") return v < 1 ? msText(v) : v.toFixed(2) + " s";
  if (pedal === "delay" && param === "tone" || pedal === "delay" && param === "lowCut") return hzText(v);
  if (pedal === "delay" && param === "modDepth") return (v * 1000).toFixed(1) + " ms";
  if (pedal === "delay" && param === "modRate") return hzText(v);
  if (pedal === "reverb" && param === "decay") return v.toFixed(1) + " s";
  if (pedal === "reverb" && param === "tone") return hzText(v);
  if (pedal === "reverb" && param === "predelay") return msText(v);
  if (pedal === "reverb" && param === "size") return v.toFixed(2) + "×";
  return pctText(knob);
}

export function paramLabel(pedal, param, type) {
  if (pedal === "mod" && param === "color") {
    if (type === "tremolo") return "Shape";
    if (type === "phaser" || type === "flanger") return "Feedback";
    return "Tone";
  }
  if (pedal === "filter" && param === "rate") return type === "wah" ? "Attack" : "Rate";
  if (pedal === "filter" && param === "depth") return type === "wah" ? "Depth" : "Sweep";
  if (pedal === "filter" && param === "freq") return type === "wah" ? "Range" : "Freq";
  return LABELS[pedal][param];
}

export function displayName(id, type) {
  if (id === "mod") {
    return { chorus: "Chorus", phaser: "Phaser", flanger: "Flanger", tremolo: "Tremolo", vibrato: "Vibrato" }[type] || "Modulation";
  }
  if (id === "filter") {
    return { wah: "Auto-Wah", lowpass: "Low Pass", highpass: "High Pass" }[type] || "Filter";
  }
  if (id === "reverb") {
    return { room: "Room", hall: "Hall", spring: "Spring", plate: "Plate" }[type] || "Reverb";
  }
  if (id === "drive") return "Drive";
  if (id === "delay") return "Delay";
  return id;
}

export function chainText(state) {
  if (!state.order.length) return "No pedals — dry signal";
  return state.order.map((id) => displayName(id, state.pedals[id].type)).join(" → ");
}

export function blendGains(mode, enabled, mix) {
  const m = clamp01(mix);
  if (!enabled) return { dry: 1, wet: 0 };
  if (mode === "add") return { dry: 1, wet: m };
  const theta = m * Math.PI / 2;
  return { dry: Math.cos(theta), wet: Math.sin(theta) };
}

export function driveMakeup(preGain, fuzz) {
  const f = clamp01(fuzz);
  const soft = Math.tanh(preGain * 2.4);
  const hard = Math.min(1, Math.tanh(preGain * 6) * 1.05);
  const peak = soft * (1 - f) + hard * f;
  return 1 / Math.max(0.22, peak);
}

export function formatGainDb(gain) {
  if (!(gain > 0.001)) return "Off";
  const db = 20 * Math.log10(gain);
  return (db >= 0 ? "+" : "") + db.toFixed(1) + " dB";
}

export function meterPercent(rms) {
  const db = 20 * Math.log10(Math.max(rms, 1e-8));
  return clamp((db + 42) / 42, 0, 1);
}

function makeCurve(fn) {
  const n = 2049;
  const c = new Float32Array(n);
  for (let i = 0; i < n; i++) c[i] = fn((i / (n - 1)) * 2 - 1);
  return c;
}

export function makeSoftCurve() {
  return makeCurve((x) => Math.tanh(x * 2.4));
}

export function makeHardCurve() {
  return makeCurve((x) => {
    const y = Math.tanh(x * 8);
    const asym = Math.tanh((x + 0.18) * 6.5);
    return Math.max(-0.98, Math.min(0.98, y * 0.62 + asym * 0.38));
  });
}

export function makeSafetyCurve() {
  const drive = 1.55;
  const norm = Math.tanh(drive);
  return makeCurve((x) => Math.tanh(x * drive) / norm);
}

export function makeTremCurve() {
  return makeCurve((x) => Math.tanh(x * 5));
}

export function moveItem(list, index, dir) {
  const next = list.slice();
  const j = index + dir;
  if (index < 0 || index >= next.length || j < 0 || j >= next.length) return next;
  const [item] = next.splice(index, 1);
  next.splice(j, 0, item);
  return next;
}

export function reorder(list, id, targetIndex) {
  const next = list.filter((x) => x !== id);
  const i = Math.max(0, Math.min(next.length, targetIndex));
  next.splice(i, 0, id);
  return next;
}

export function freshState() {
  const pedals = {};
  for (const id of PEDAL_IDS) {
    pedals[id] = {
      onBoard: false,
      enabled: false,
      type: DEFAULT_TYPE[id],
      more: false,
      params: Object.assign({}, DEFAULT_PARAMS[id]),
    };
  }
  return {
    source: "test",
    deviceId: "",
    inputGain: 1,
    master: 0.8,
    order: [],
    preset: null,
    player: defaultPlayer(),
    pedals,
  };
}

export function applyPreset(state, presetId) {
  const preset = PRESETS.find((p) => p.id === presetId);
  if (!preset) return state;
  const next = freshState();
  next.source = state.source;
  next.deviceId = state.deviceId;
  next.inputGain = state.inputGain;
  next.master = state.master;
  next.player = Object.assign(defaultPlayer(), state.player);
  next.order = preset.order.slice();
  next.preset = preset.id;
  for (const id of preset.order) {
    const src = preset.pedals[id] || {};
    const pedal = next.pedals[id];
    pedal.onBoard = true;
    pedal.enabled = true;
    if (src.type && validType(id, src.type)) pedal.type = src.type;
    pedal.params = Object.assign({}, DEFAULT_PARAMS[id], src.params || {});
    for (const key of Object.keys(pedal.params)) pedal.params[key] = clamp01(pedal.params[key]);
  }
  return next;
}

export function initialState() {
  return applyPreset(freshState(), "clean-room");
}

export function serialize(state) {
  const pedals = {};
  for (const id of PEDAL_IDS) {
    const p = state.pedals[id];
    pedals[id] = { enabled: !!p.enabled, type: p.type, more: !!p.more, params: Object.assign({}, p.params) };
  }
  return {
    v: 1,
    source: state.source,
    deviceId: state.deviceId || "",
    inputGain: state.inputGain,
    master: state.master,
    player: Object.assign(defaultPlayer(), state.player),
    order: state.order.slice(),
    preset: state.preset,
    pedals,
  };
}

export function hydrate(raw) {
  if (!raw || typeof raw !== "object") return initialState();
  const next = freshState();
  next.source = raw.source === "guitar" ? "guitar" : "test";
  next.player = sanitizePlayer(raw.player);
  next.deviceId = typeof raw.deviceId === "string" ? raw.deviceId.slice(0, 256) : "";
  const ig = Number(raw.inputGain);
  next.inputGain = Number.isFinite(ig) ? clamp(ig, 0, INPUT_GAIN_MAX) : 1;
  const m = Number(raw.master);
  next.master = Number.isFinite(m) ? clamp(m, 0, 1) : 0.8;
  const saved = raw.pedals && typeof raw.pedals === "object" ? raw.pedals : {};
  for (const id of PEDAL_IDS) {
    const src = saved[id];
    if (!src || typeof src !== "object") continue;
    const pedal = next.pedals[id];
    if (typeof src.type === "string" && validType(id, src.type)) pedal.type = src.type;
    pedal.more = !!src.more;
    pedal.enabled = !!src.enabled;
    if (src.params && typeof src.params === "object") {
      for (const key of Object.keys(DEFAULT_PARAMS[id])) {
        const n = Number(src.params[key]);
        if (Number.isFinite(n)) pedal.params[key] = clamp01(n);
      }
    }
  }
  const order = [];
  const list = Array.isArray(raw.order) ? raw.order : [];
  for (const id of list) {
    if (PEDAL_IDS.includes(id) && !order.includes(id)) order.push(id);
  }
  next.order = order;
  for (const id of PEDAL_IDS) {
    next.pedals[id].onBoard = order.includes(id);
    if (!order.includes(id)) next.pedals[id].enabled = false;
  }
  next.preset = PRESETS.some((p) => p.id === raw.preset) ? raw.preset : null;
  return next;
}

// Eight-delay FDN reverb. Unitary Hadamard mixing, input diffusion,
// early taps, and a short modulated comb when the type is spring.
// Loop gain is per-line from T60 and hard-capped so the tank cannot run away.

export const MAX_REVERB_LOOP = 0.98;

export const DELAYS_48K = {
  room: [983, 1109, 1249, 1409, 1597, 1801, 2039, 2297],
  hall: [1913, 2179, 2467, 2797, 3163, 3571, 4057, 4603],
  plate: [1399, 1567, 1777, 2017, 2287, 2579, 2917, 3319],
  spring: [677, 761, 857, 983, 1103, 1237, 1423, 1597],
};

const AP_48K = [149, 227, 383, 557];
const AP_GAIN = [0.7, 0.68, -0.62, 0.58];

const EARLY_MS = {
  room: [[11, 0.28], [17, 0.2], [29, 0.14], [41, 0.09]],
  hall: [[23, 0.26], [41, 0.18], [67, 0.12], [97, 0.08]],
  plate: [[13, 0.2], [19, 0.14], [31, 0.09]],
  spring: [[7, 0.16], [13, 0.1]],
};

export function loopGainForDelay(delaySamples, sampleRate, t60) {
  if (!(delaySamples > 0) || !(sampleRate > 0) || !(t60 > 0.01)) return 0;
  const seconds = delaySamples / sampleRate;
  const g = Math.pow(10, (-3 * seconds) / t60);
  if (!Number.isFinite(g) || g < 0) return 0;
  return Math.min(MAX_REVERB_LOOP, g);
}

export function fillDelaySamples(type, size, sampleRate, out) {
  const table = DELAYS_48K[type] || DELAYS_48K.room;
  const scale = (sampleRate / 48000) * size;
  for (let i = 0; i < 8; i++) out[i] = table[i] * scale;
  return out;
}

function hadamard8(v, out) {
  const s = 0.3535533905932738;
  const a = v[0], b = v[1], c = v[2], d = v[3], e = v[4], f = v[5], g = v[6], h = v[7];
  const a1 = a + b, b1 = a - b, c1 = c + d, d1 = c - d, e1 = e + f, f1 = e - f, g1 = g + h, h1 = g - h;
  const a2 = a1 + c1, c2 = a1 - c1, b2 = b1 + d1, d2 = b1 - d1, e2 = e1 + g1, g2 = e1 - g1, f2 = f1 + h1, h2 = f1 - h1;
  out[0] = (a2 + e2) * s;
  out[4] = (a2 - e2) * s;
  out[1] = (b2 + f2) * s;
  out[5] = (b2 - f2) * s;
  out[2] = (c2 + g2) * s;
  out[6] = (c2 - g2) * s;
  out[3] = (d2 + h2) * s;
  out[7] = (d2 - h2) * s;
}

class DelayLine {
  constructor(maxSamples) {
    this.max = maxSamples;
    this.buf = new Float32Array(maxSamples);
    this.w = 0;
  }
  clear() {
    this.buf.fill(0);
    this.w = 0;
  }
  write(x) {
    if (x > -1e-20 && x < 1e-20) x = 0;
    this.buf[this.w] = x;
    this.w++;
    if (this.w >= this.max) this.w = 0;
  }
  // Samples ago. Call before write() on this tick.
  read(delaySamples) {
    let d = delaySamples;
    if (!Number.isFinite(d)) return 0;
    if (d < 1) d = 1;
    if (d > this.max - 2) d = this.max - 2;
    let rp = this.w - d;
    if (rp < 0) rp += this.max;
    const i0 = rp | 0;
    const frac = rp - i0;
    const i1 = i0 + 1 >= this.max ? 0 : i0 + 1;
    const a = this.buf[i0];
    const b = this.buf[i1];
    return a + (b - a) * frac;
  }
}

class Allpass {
  constructor(maxSamples) {
    this.dl = new DelayLine(maxSamples);
  }
  clear() {
    this.dl.clear();
  }
  process(x, delay, g) {
    const d = this.dl.read(delay);
    const y = d - g * x;
    this.dl.write(x + g * y);
    return y;
  }
}

class Lowpass {
  constructor() {
    this.z = 0;
  }
  clear() {
    this.z = 0;
  }
  process(x, coeff) {
    this.z += coeff * (x - this.z);
    if (this.z > -1e-20 && this.z < 1e-20) this.z = 0;
    return this.z;
  }
}

class DCBlock {
  constructor() {
    this.x1 = 0;
    this.y1 = 0;
  }
  clear() {
    this.x1 = 0;
    this.y1 = 0;
  }
  process(x) {
    const y = x - this.x1 + 0.995 * this.y1;
    this.x1 = x;
    this.y1 = y;
    return y;
  }
}

export class ReverbCore {
  constructor(sampleRate) {
    this.sr = sampleRate;
    const scale = sampleRate / 48000;
    const lineMax = Math.ceil(5200 * scale * 1.7) + 8;
    this.lines = [];
    this.damp = [];
    for (let i = 0; i < 8; i++) {
      this.lines.push(new DelayLine(lineMax));
      this.damp.push(new Lowpass());
    }
    const apMax = Math.ceil(900 * scale) + 8;
    this.ap = AP_48K.map(() => new Allpass(apMax));
    this.apLen = AP_48K.map((n) => Math.max(2, Math.round(n * scale)));
    this.early = new DelayLine(Math.ceil(sampleRate * 0.45));
    this.drip = new DelayLine(Math.ceil(sampleRate * 0.08));
    this.dripLp = new Lowpass();
    this.dripBase = Math.max(2, Math.round(0.042 * sampleRate));
    this.dripMod = Math.max(1, Math.round(0.0035 * sampleRate));
    this.dcL = new DCBlock();
    this.dcR = new DCBlock();
    this.hpZ = 0;
    this.hpC = 1 - Math.exp((-2 * Math.PI * 42) / sampleRate);
    this.y = new Float64Array(8);
    this.mixed = new Float64Array(8);
    this.targetLen = new Float64Array(8);
    this.curLen = new Float64Array(8);
    this.smGain = new Float64Array(8);
    this.gainTarget = new Float64Array(8);
    this.taps = [];
    this.type = "";
    this.t60 = 1.4;
    this.cutoff = 4000;
    this.predelay = 0.02;
    this.width = 0.9;
    this.mod = 0.3;
    this.size = 1;
    this.preCur = 1;
    this.smDamp = 0.3;
    this.smWidth = 0.9;
    this.lfo = 0;
    this.lfoInc = 0.5 / sampleRate;
    this.ready = false;
    this.gainsReady = false;
    this.fdnTrim = 3.4;
    this.inject = 0.5;
    this.lpCoeff = 1 - Math.exp((-2 * Math.PI * 1600) / sampleRate);

  clear() {
    for (let i = 0; i < 8; i++) {
      this.lines[i].clear();
      this.damp[i].clear();
      this.smGain[i] = 0;
    }
    for (let i = 0; i < this.ap.length; i++) this.ap[i].clear();
    this.early.clear();
    this.drip.clear();
    this.dripLp.clear();
    this.dcL.clear();
    this.dcR.clear();
    this.hpZ = 0;
    this.ready = false;
    this.gainsReady = false;
  }

  setControls(c) {
    const type = DELAYS_48K[c.type] ? c.type : "room";
    const typeChanged = type !== this.type;

    this.t60 = c.t60 > 0.05 ? c.t60 : 0.05;
    this.cutoff = c.cutoff > 200 ? c.cutoff : 200;
    this.predelay = c.predelay > 0 ? c.predelay : 0;
    this.width = c.width > 0 ? c.width : 0;
    this.mod = c.mod > 0 ? c.mod : 0;

        gain: pair[1],
        right: idx % 2 === 1,
      }));
      this.lfoInc = (type === "spring" ? 1.25 : 0.42) / this.sr;
      if (typeChanged) this.clear();
      this.ready = true;
      for (let i = 0; i < 8; i++) this.curLen[i] = this.targetLen[i];
    }
  }

  process(input, outL, outR) {
    const n = input.length;
    const preTarget = Math.max(0, this.predelay * this.sr);
    const modAmt = this.mod * (this.type === "spring" ? 22 : 10) * (this.sr / 48000);
    const dampMix = Math.min(0.82, Math.max(0.04, (11000 - this.cutoff) / 11000));
    for (let i = 0; i < 8; i++) {
      this.gainTarget[i] = loopGainForDelay(this.curLen[i], this.sr, this.t60);
    }
    if (!this.gainsReady) {
      for (let i = 0; i < 8; i++) this.smGain[i] = this.gainTarget[i];
      this.smDamp = dampMix;
      this.gainsReady = true;
    }
    const y = this.y;
    const mixed = this.mixed;
    const spring = this.type === "spring";
    for (let i = 0; i < n; i++) {
      this.smDamp += (dampMix - this.smDamp) * 0.0015;
      this.smWidth += (this.width - this.smWidth) * 0.002;
      this.preCur += (preTarget - this.preCur) * 0.0008;
      for (let d = 0; d < 8; d++) {
        this.curLen[d] += (this.targetLen[d] - this.curLen[d]) * 0.00012;
        this.smGain[d] += (this.gainTarget[d] - this.smGain[d]) * 0.002;
      }
      const x0 = input[i] || 0;
      this.hpZ += this.hpC * (x0 - this.hpZ);
      const x = x0 - this.hpZ;
      const pre = this.preCur >= 1.5 ? this.early.read(this.preCur) : x;
      let earlyL = 0;
      let earlyR = 0;
      for (let t = 0; t < this.taps.length; t++) {
        const tap = this.taps[t];
        const s = this.early.read(this.preCur + tap.samples) * tap.gain;
        if (tap.right) earlyR += s;
        else earlyL += s;
      }
      this.early.write(x);

      let diffused = pre;
      for (let a = 0; a < 4; a++) diffused = this.ap[a].process(diffused, this.apLen[a], AP_GAIN[a]);

      this.lfo += this.lfoInc;
      if (this.lfo > 1) this.lfo -= 1;
      const s1 = Math.sin(this.lfo * 6.283185307179586);
      const s2 = Math.sin(this.lfo * 6.283185307179586 + 2.2);

      for (let d = 0; d < 8; d++) {
        let len = this.curLen[d];
        if (d === 0) len += s1 * modAmt;
        else if (d === 5) len += s2 * modAmt * 0.65;
        y[d] = this.lines[d].read(len);
      }
      hadamard8(y, mixed);
      const inject = diffused * this.inject;
      for (let d = 0; d < 8; d++) {
        const lp = this.damp[d].process(mixed[d], this.lpCoeff);
        const shaped = mixed[d] + (lp - mixed[d]) * this.smDamp;
        let fb = shaped * this.smGain[d];
        if (fb > 1.25 || fb < -1.25) fb = Math.tanh(fb);
        this.lines[d].write(fb + inject);
      }

      let l = earlyL;
      let r = earlyR;
      for (let d = 0; d < 8; d++) {
        const s = y[d] * this.fdnTrim;
        if (d & 1) r += s;
        else l += s;
      }
      if (spring) {
        const dlen = this.dripBase + s1 * this.dripMod;
        const dr = this.drip.read(dlen);
        const band = dr - this.dripLp.process(dr, 0.32);
        this.drip.write(x * 0.7 + band * 0.46);
        l += band * 0.38;
        r += band * 0.3;
      }

      const mid = 0.5 * (l + r);
      const side = 0.5 * (l - r) * this.smWidth;
      let ol = this.dcL.process(mid + side);
      let orr = this.dcR.process(mid - side);
      if (ol > 2) ol = 2;
      else if (ol < -2) ol = -2;
      if (orr > 2) orr = 2;
      else if (orr < -2) orr = -2;
      outL[i] = ol;
      outR[i] = orr;
    }
  }
}

// Sample-by-sample envelope follower. Used by the AudioWorklet and by tests.

export function createEnvelopeFollower(sampleRate) {
  let env = 0;
  return {
    reset() {
      env = 0;
    },
    get env() {
      return env;
    },
    process(input, output, attackSec, releaseSec, depth, rangeHz) {
      const n = output.length;
      const a = 1 - Math.exp(-1 / (sampleRate * Math.max(0.001, attackSec)));
      const r = 1 - Math.exp(-1 / (sampleRate * Math.max(0.005, releaseSec)));
      const d = depth > 0 ? depth : 0;
      const range = rangeHz > 0 ? rangeHz : 0;
      for (let i = 0; i < n; i++) {
        const s = Math.abs(input[i] || 0);
        const c = s > env ? a : r;
        env += c * (s - env);
        const shaped = Math.pow(Math.min(1, env * 3.5), 0.8);
        output[i] = shaped * d * range;
      }
    },
  };
}
