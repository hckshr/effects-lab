// Web Audio graph. Pedals are stereo so a chorus or reverb keeps its image
// wherever it sits in the chain. Knobs move with setTargetAtTime.

const SOFT_CURVE = makeSoftCurve();
const HARD_CURVE = makeHardCurve();
const CLIP_CURVE = makeSafetyCurve();
const TREM_CURVE = makeTremCurve();

function stereoGain(ctx) {
  const g = ctx.createGain();
  g.channelCount = 2;
  g.channelCountMode = "explicit";
  g.channelInterpretation = "speakers";
  return g;
}

function approach(ctx, param, value, tc) {
  const now = ctx.currentTime;
  const v = Number.isFinite(value) ? value : 0;
  try {
    param.setTargetAtTime(v, now, tc || 0.02);
  } catch (err) {
    param.value = v;
  }
}

function stopBag(bag) {
  if (!bag) return;
  for (let i = 0; i < bag.length; i++) {
    const node = bag[i];
    try {
      if (typeof node.stop === "function") node.stop();
    } catch (err) { /* already stopped */ }
    try { node.disconnect(); } catch (err) { /* already disconnected */ }
  }
  bag.length = 0;
}

function buildChorus(ctx, head, wetOut, bag, kind) {
  const base = kind === "vibrato" ? 0.0075 : 0.016;
  const splitter = ctx.createChannelSplitter(2);
  const merger = ctx.createChannelMerger(2);
  head.connect(splitter);
  const lfo = ctx.createOscillator();
  lfo.type = "sine";
  const inv = ctx.createGain();
  inv.gain.value = kind === "vibrato" ? 1 : -1;
  lfo.connect(inv);
  const delays = [];
  const depths = [];
  const pans = [];
  const tones = [];
  for (let ch = 0; ch < 2; ch++) {
    const delay = ctx.createDelay(0.05);
    delay.delayTime.value = base + (kind === "vibrato" ? 0 : ch * 0.0015);
    const depth = ctx.createGain();
    (ch === 0 ? lfo : inv).connect(depth);
    depth.connect(delay.delayTime);
    const tone = ctx.createBiquadFilter();
    tone.type = "lowpass";
    tone.Q.value = 0.7;
    tone.frequency.value = 4000;
    const gL = ctx.createGain();
    const gR = ctx.createGain();
    splitter.connect(delay, ch);
    delay.connect(tone);
    tone.connect(gL);
    tone.connect(gR);
    gL.connect(merger, 0, 0);
    gR.connect(merger, 0, 1);
    delays.push(delay);
    depths.push(depth);
    pans.push([gL, gR]);
    tones.push(tone);
    bag.push(delay, depth, tone, gL, gR);
  }
  merger.connect(wetOut);
  lfo.start();
  bag.push(splitter, merger, lfo, inv);
  return { kind: "chorus", lfo, delays, depths, pans, tones };
}

function buildFlanger(ctx, head, wetOut, bag) {
  const splitter = ctx.createChannelSplitter(2);
  const merger = ctx.createChannelMerger(2);
  head.connect(splitter);
  const lfo = ctx.createOscillator();
  lfo.type = "sine";
  const inv = ctx.createGain();
  inv.gain.value = -1;
  lfo.connect(inv);
  const fbs = [];
  const depths = [];
  const delays = [];
  for (let ch = 0; ch < 2; ch++) {
    const sum = ctx.createGain();
    const delay = ctx.createDelay(0.02);
    delay.delayTime.value = 0.0032;
    const lp = ctx.createBiquadFilter();
    lp.type = "lowpass";
    lp.frequency.value = 5200;
    lp.Q.value = 0.7;
    const hp = ctx.createBiquadFilter();
    hp.type = "highpass";
    hp.frequency.value = 140;
    hp.Q.value = 0.7;
    const fb = ctx.createGain();
    const depth = ctx.createGain();
    (ch === 0 ? lfo : inv).connect(depth);
    depth.connect(delay.delayTime);
    splitter.connect(sum, ch);
    fb.connect(sum);
    sum.connect(delay);
    delay.connect(lp);
    lp.connect(hp);
    hp.connect(fb);
    hp.connect(merger, 0, ch);
    fbs.push(fb);
    depths.push(depth);
    delays.push(delay);
    bag.push(sum, delay, lp, hp, fb, depth);
  }
  merger.connect(wetOut);
  lfo.start();
  bag.push(splitter, merger, lfo, inv);
  return { kind: "flanger", lfo, fbs, depths, delays };
}

function buildPhaser(ctx, head, wetOut, bag) {
  const splitter = ctx.createChannelSplitter(2);
  const merger = ctx.createChannelMerger(2);
  head.connect(splitter);
  const lfo = ctx.createOscillator();
  lfo.type = "sine";
  const inv = ctx.createGain();
  inv.gain.value = -1;
  lfo.connect(inv);
  const ratios = [1, 1.16, 1.34, 1.55, 1.78, 2.05];
  const stages = [[], []];
  const depthGains = [[], []];
  const fbs = [];
  for (let ch = 0; ch < 2; ch++) {
    const sum = ctx.createGain();
    splitter.connect(sum, ch);
    let node = sum;
    for (let s = 0; s < ratios.length; s++) {
      const ap = ctx.createBiquadFilter();
      ap.type = "allpass";
      ap.Q.value = 0.9;
      ap.frequency.value = 780 * ratios[s];
      const dg = ctx.createGain();
      (ch === 0 ? lfo : inv).connect(dg);
      dg.connect(ap.frequency);
      node.connect(ap);
      node = ap;
      stages[ch].push(ap);
      depthGains[ch].push(dg);
      bag.push(ap, dg);
    }
    const fb = ctx.createGain();
    node.connect(fb);
    fb.connect(sum);
    node.connect(merger, 0, ch);
    fbs.push(fb);
    bag.push(sum, fb);
  }
  merger.connect(wetOut);
  lfo.start();
  bag.push(splitter, merger, lfo, inv);
  return { kind: "phaser", lfo, stages, depthGains, fbs, ratios };
}

function buildTremolo(ctx, head, wetOut, bag) {
  const splitter = ctx.createChannelSplitter(2);
  const merger = ctx.createChannelMerger(2);
  head.connect(splitter);
  const lfo = ctx.createOscillator();
  lfo.type = "sine";
  const shaper = ctx.createWaveShaper();
  shaper.curve = TREM_CURVE;
  const raw = ctx.createGain();
  const shaped = ctx.createGain();
  const bus = ctx.createGain();
  lfo.connect(raw);
  lfo.connect(shaper);
  shaper.connect(shaped);
  raw.connect(bus);
  shaped.connect(bus);
  const depthL = ctx.createGain();
  const depthR = ctx.createGain();
  bus.connect(depthL);
  bus.connect(depthR);
  const gL = ctx.createGain();
  const gR = ctx.createGain();
  depthL.connect(gL.gain);
  depthR.connect(gR.gain);
  splitter.connect(gL, 0);
  splitter.connect(gR, 1);
  gL.connect(merger, 0, 0);
  gR.connect(merger, 0, 1);
  merger.connect(wetOut);
  lfo.start();
  bag.push(splitter, merger, lfo, shaper, raw, shaped, bus, depthL, depthR, gL, gR);
  return { kind: "tremolo", lfo, raw, shaped, depthL, depthR, gL, gR };
}

function buildDrive(ctx, head, wetOut, bag) {
  const hp = ctx.createBiquadFilter();
  hp.type = "highpass";
  hp.frequency.value = 75;
  hp.Q.value = 0.7;
  const pre = ctx.createGain();
  head.connect(hp);
  hp.connect(pre);
  const splitter = ctx.createChannelSplitter(2);
  const merger = ctx.createChannelMerger(2);
  pre.connect(splitter);
  const softG = [];
  const hardG = [];
  const tones = [];
  for (let ch = 0; ch < 2; ch++) {
    const soft = ctx.createWaveShaper();
    soft.curve = SOFT_CURVE;
    soft.oversample = "2x";
    const hard = ctx.createWaveShaper();
    hard.curve = HARD_CURVE;
    hard.oversample = "2x";
    const gs = ctx.createGain();
    const gh = ctx.createGain();
    const sum = ctx.createGain();
    const tone = ctx.createBiquadFilter();
    tone.type = "lowpass";
    tone.Q.value = 0.7;
    splitter.connect(soft, ch);
    splitter.connect(hard, ch);
    soft.connect(gs);
    hard.connect(gh);
    gs.connect(sum);
    gh.connect(sum);
    sum.connect(tone);
    tone.connect(merger, 0, ch);
    softG.push(gs);
    hardG.push(gh);
    tones.push(tone);
    bag.push(soft, hard, gs, gh, sum, tone);
  }
  const post = ctx.createGain();
  merger.connect(post);
  post.connect(wetOut);
  bag.push(hp, pre, splitter, merger, post);
  return { pre, softG, hardG, tones, post };
}

function buildFilter(ctx, head, wetOut, bag) {
  const splitter = ctx.createChannelSplitter(2);
  const merger = ctx.createChannelMerger(2);
  const sense = ctx.createGain();
  head.connect(splitter);
  head.connect(sense);
  const filters = [];
  for (let ch = 0; ch < 2; ch++) {
    const f = ctx.createBiquadFilter();
    f.type = "lowpass";
    f.frequency.value = 1200;
    f.Q.value = 0.7;
    splitter.connect(f, ch);
    f.connect(merger, 0, ch);
    filters.push(f);
    bag.push(f);
  }
  merger.connect(wetOut);
  const lfo = ctx.createOscillator();
  lfo.type = "sine";
  const lfoDepth = ctx.createGain();
  lfoDepth.gain.value = 0;
  lfo.connect(lfoDepth);
  lfoDepth.connect(filters[0].frequency);
  lfoDepth.connect(filters[1].frequency);
  lfo.start();
  bag.push(splitter, merger, sense, lfo, lfoDepth);
  return { filters, lfo, lfoDepth, sense };
}

function buildDelay(ctx, head, wetOut, bag) {
  const splitter = ctx.createChannelSplitter(2);
  const merger = ctx.createChannelMerger(2);
  head.connect(splitter);
  const lfo = ctx.createOscillator();
  lfo.type = "sine";
  const inv = ctx.createGain();
  inv.gain.value = -1;
  lfo.connect(inv);
  const delays = [];
  const fbs = [];
  const tones = [];
  const lows = [];
  const depths = [];
  for (let ch = 0; ch < 2; ch++) {
    const sum = ctx.createGain();
    const delay = ctx.createDelay(1.25);
    delay.delayTime.value = 0.32;
    const lp = ctx.createBiquadFilter();
    lp.type = "lowpass";
    lp.Q.value = 0.707;
    const hp = ctx.createBiquadFilter();
    hp.type = "highpass";
    hp.Q.value = 0.707;
    const fb = ctx.createGain();
    const depth = ctx.createGain();
    (ch === 0 ? lfo : inv).connect(depth);
    depth.connect(delay.delayTime);
    splitter.connect(sum, ch);
    fb.connect(sum);
    sum.connect(delay);
    delay.connect(lp);
    lp.connect(hp);
    hp.connect(fb);
    hp.connect(merger, 0, ch);
    delays.push(delay);
    fbs.push(fb);
    tones.push(lp);
    lows.push(hp);
    depths.push(depth);
    bag.push(sum, delay, lp, hp, fb, depth);
  }
  merger.connect(wetOut);
  lfo.start();
  bag.push(splitter, merger, lfo, inv);
  return { lfo, delays, fbs, tones, lows, depths };
}

function makeShell(ctx, blend) {
  const input = stereoGain(ctx);
  const output = stereoGain(ctx);
  const dry = stereoGain(ctx);
  const wet = stereoGain(ctx);
  const head = stereoGain(ctx);
  const wetOut = stereoGain(ctx);
  input.connect(dry);
  dry.connect(output);
  input.connect(head);
  wetOut.connect(wet);
  wet.connect(output);
  dry.gain.value = 1;
  wet.gain.value = 0;
  return { input, output, dry, wet, head, wetOut, blend, bag: [], modBag: [] };
}

class Engine {
  constructor() {
    this.ctx = null;
    this.running = false;
    this.meter = 0;
    this.peakMeter = 0;
    this.displayPeak = 0;
    this.reverbMode = "none";
    this.order = [];
    this.attempts = [];
    this.constraints = null;
    this.onMeter = null;
    this.onDevices = null;
    this.modType = "";
    this.reverbType = "";
    this.filterType = "";
    this.liveFilter = null;
    this.typeTimers = {};
    this.noteTimers = [];
    this.testLive = false;
    this.shells = {};
    this.built = false;
    this.tone = null;
    this.repeatTimer = null;
    this.repeatSpec = null;
  }

  // Call from the user gesture, before any await, so the browser unlocks audio.
  ensureContext() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC({ latencyHint: "interactive" });
    }
    this.ctx.resume();
    return this.ctx;
  }

  async prepare(state) {
    this.ensureContext();
    if (this.ctx.state === "suspended") await this.ctx.resume();
    if (!this.built) {
      await this.loadWorklet();
      this.build();
      this.built = true;
      this.order = state.order.slice();
      this.reconnectNow();
    }
    this.sync(state, false);
    this.running = true;
    if (!this.raf) this.tick();
    approach(this.ctx, this.testGain.gain, 0.9, 0.015);
  }

  async useGuitar(deviceId) {
    this.stopTest();
    this.stopRepeat();
    this.releaseTone(0.05);
    approach(this.ctx, this.testGain.gain, 0, 0.02);
    await this.openMic(deviceId);
    approach(this.ctx, this.micGain.gain, 1, 0.03);
  }

  leaveGuitar() {
    this.stopMic();
    if (!this.ctx || !this.micGain) return;
    approach(this.ctx, this.micGain.gain, 0, 0.02);
    approach(this.ctx, this.testGain.gain, 0.9, 0.02);
  }

  async stop() {
    this.running = false;
    this.stopTest();
    this.stopRepeat();
    this.releaseTone(0.05);
    this.stopMic();
    if (this.raf) cancelAnimationFrame(this.raf);
    if (this.ctx && this.ctx.state === "running") await this.ctx.suspend();
  }

  async loadWorklet() {
    this.workletOk = false;
    try {
      const url = typeof WORKLET_URL === "string" ? WORKLET_URL : "/worklet.js";
      await this.ctx.audioWorklet.addModule(url);
      this.workletOk = true;
    } catch (err) {
      this.workletOk = false;
    }
  }

  build() {
    const ctx = this.ctx;
    this.inputGain = stereoGain(ctx);
    this.micGain = ctx.createGain();
    this.testGain = ctx.createGain();
    this.micGain.gain.value = 0;
    this.testGain.gain.value = 0;
    this.micGain.connect(this.inputGain);
    this.testGain.connect(this.inputGain);
    this.analyser = ctx.createAnalyser();
    this.analyser.fftSize = 1024;
    this.analyser.smoothingTimeConstant = 0.45;
    this.buf = new Float32Array(this.analyser.fftSize);
    this.inputGain.connect(this.analyser);
    this.chainIn = stereoGain(ctx);
    this.inputGain.connect(this.chainIn);
    this.duck = stereoGain(ctx);
    this.master = stereoGain(ctx);
    this.master.gain.value = 0.8;
    this.duck.connect(this.master);
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -2.5;
    comp.knee.value = 3;
    comp.ratio.value = 18;
    comp.attack.value = 0.003;
    comp.release.value = 0.1;
    const clip = ctx.createWaveShaper();
    clip.curve = CLIP_CURVE;
    clip.oversample = "2x";
    this.master.connect(comp);
    comp.connect(clip);
    clip.connect(ctx.destination);

    this.shells.drive = makeShell(ctx, "replace");
    this.shells.drive.fx = buildDrive(ctx, this.shells.drive.head, this.shells.drive.wetOut, this.shells.drive.bag);

    this.shells.mod = makeShell(ctx, "replace");
    this.rebuildMod("chorus");

    this.shells.filter = makeShell(ctx, "replace");
    this.shells.filter.fx = buildFilter(ctx, this.shells.filter.head, this.shells.filter.wetOut, this.shells.filter.bag);

    this.shells.delay = makeShell(ctx, "add");
    this.shells.delay.fx = buildDelay(ctx, this.shells.delay.head, this.shells.delay.wetOut, this.shells.delay.bag);

    this.shells.reverb = makeShell(ctx, "add");
    this.buildReverb();

    if (this.workletOk && this.envNode) {
      try {
        this.shells.filter.fx.sense.connect(this.envNode);
        this.envNode.connect(this.shells.filter.fx.filters[0].frequency);
        this.envNode.connect(this.shells.filter.fx.filters[1].frequency);
      } catch (err) {
        this.envNode = null;
      }
    }
    this.follower = createEnvelopeFollower(ctx.sampleRate);
    this.envOut = new Float32Array(this.buf.length);
  }

  buildReverb() {
    const ctx = this.ctx;
    const shell = this.shells.reverb;
    if (this.workletOk) {
      try {
        const node = new AudioWorkletNode(ctx, "reverb-fdn", {
          numberOfInputs: 1,
          numberOfOutputs: 1,
          outputChannelCount: [2],
        });
        shell.head.connect(node);
        node.connect(shell.wetOut);
        shell.bag.push(node);
        shell.fx = { mode: "worklet", node };
        this.envNode = new AudioWorkletNode(ctx, "envelope-follow");
        this.reverbMode = "worklet";
        return;
      } catch (err) {
        this.workletOk = false;
      }
    }
    const a = ctx.createConvolver();
    const b = ctx.createConvolver();
    const gA = ctx.createGain();
    const gB = ctx.createGain();
    gA.gain.value = 1;
    gB.gain.value = 0;
    shell.head.connect(a);
    shell.head.connect(b);
    a.connect(gA);
    b.connect(gB);
    gA.connect(shell.wetOut);
    gB.connect(shell.wetOut);
    shell.bag.push(a, b, gA, gB);
    shell.fx = { mode: "convolver", a, b, gA, gB, active: 0 };
    this.reverbMode = "convolver";
    this.envNode = null;
  }

  rebuildMod(type) {
    const shell = this.shells.mod;
    stopBag(shell.modBag);
    shell.modBag = [];
    try { shell.head.disconnect(); } catch (err) { /* first build */ }
    const kind = type === "vibrato" ? "vibrato" : type;
    let fx;
    if (kind === "phaser") fx = buildPhaser(this.ctx, shell.head, shell.wetOut, shell.modBag);
    else if (kind === "flanger") fx = buildFlanger(this.ctx, shell.head, shell.wetOut, shell.modBag);
    else if (kind === "tremolo") fx = buildTremolo(this.ctx, shell.head, shell.wetOut, shell.modBag);
    else fx = buildChorus(this.ctx, shell.head, shell.wetOut, shell.modBag, kind === "vibrato" ? "vibrato" : "chorus");
    shell.fx = fx;
    this.modType = type;
  }

  sync(state, duckTypes) {
    this.setInputGain(state.inputGain);
    this.setMaster(state.master);
    for (let i = 0; i < PEDAL_IDS.length; i++) {
      const id = PEDAL_IDS[i];
      this.setPedal(id, state.pedals[id], duckTypes);
    }
    if (this.order.join() !== state.order.join()) this.setOrder(state.order);
  }

  setPedal(id, pedal, duck) {
    if (!this.ctx) return;
    const typeChanged = (id === "mod" && pedal.type !== this.modType)
      || (id === "reverb" && pedal.type !== this.reverbType && this.reverbType !== "")
      || (id === "filter" && pedal.type !== this.filterType && this.filterType !== "");
    const run = () => {
      if (id === "mod" && pedal.type !== this.modType) this.rebuildMod(pedal.type);
      if (id === "reverb") this.reverbType = pedal.type;
      if (id === "filter") this.filterType = pedal.type;
      this.apply(id, pedal);
    };
    if (duck && typeChanged) {
      this.applyBlend(this.shells[id], false, 0);
      clearTimeout(this.typeTimers[id]);
      this.typeTimers[id] = setTimeout(run, 28);
    } else {
      run();
    }
  }

  apply(id, pedal) {
    if (id === "drive") this.applyDrive(pedal);
    else if (id === "mod") this.applyMod(pedal);
    else if (id === "filter") this.applyFilter(pedal);
    else if (id === "delay") this.applyDelay(pedal);
    else if (id === "reverb") this.applyReverb(pedal);
  }

  applyBlend(shell, enabled, mix) {
    const g = blendGains(shell.blend, enabled, mix);
    approach(this.ctx, shell.dry.gain, g.dry, 0.012);
    approach(this.ctx, shell.wet.gain, g.wet, 0.012);
  }

  applyDrive(pedal) {
    const p = pedal.params;
    const fx = this.shells.drive.fx;
    const pre = mapParam("drive", "gain", p.gain);
    const fuzz = mapParam("drive", "fuzz", p.fuzz);
    approach(this.ctx, fx.pre.gain, pre, 0.02);
    for (let i = 0; i < 2; i++) {
      approach(this.ctx, fx.softG[i].gain, 1 - fuzz, 0.02);
      approach(this.ctx, fx.hardG[i].gain, fuzz, 0.02);
      approach(this.ctx, fx.tones[i].frequency, mapParam("drive", "tone", p.tone), 0.03);
    }
    const level = mapParam("drive", "level", p.level) * driveMakeup(pre, fuzz);
    approach(this.ctx, fx.post.gain, level, 0.02);
    this.applyBlend(this.shells.drive, pedal.enabled, p.mix);
  }

  applyMod(pedal) {
    const p = pedal.params;
    const type = pedal.type;
    const fx = this.shells.mod.fx;
    const rate = mapParam("mod", "rate", p.rate, type);
    const depth = mapParam("mod", "depth", p.depth, type);
    const color = mapParam("mod", "color", p.color, type);
    const width = mapParam("mod", "width", p.width, type);
    approach(this.ctx, fx.lfo.frequency, rate, 0.03);
    if (fx.kind === "chorus") {
      for (let i = 0; i < fx.depths.length; i++) approach(this.ctx, fx.depths[i].gain, depth, 0.03);
      for (let i = 0; i < fx.tones.length; i++) approach(this.ctx, fx.tones[i].frequency, color, 0.04);
      const w = clamp01(width);
      approach(this.ctx, fx.pans[0][0].gain, 0.5 + 0.5 * w, 0.03);
      approach(this.ctx, fx.pans[0][1].gain, 0.5 - 0.5 * w, 0.03);
      approach(this.ctx, fx.pans[1][0].gain, 0.5 - 0.5 * w, 0.03);
      approach(this.ctx, fx.pans[1][1].gain, 0.5 + 0.5 * w, 0.03);
    } else if (fx.kind === "flanger") {
      for (let i = 0; i < fx.depths.length; i++) approach(this.ctx, fx.depths[i].gain, depth, 0.03);
      for (let i = 0; i < fx.fbs.length; i++) approach(this.ctx, fx.fbs[i].gain, Math.min(MAX_FLANGER_FEEDBACK, color), 0.03);
    } else if (fx.kind === "phaser") {
      for (let ch = 0; ch < 2; ch++) {
        for (let s = 0; s < fx.depthGains[ch].length; s++) {
          approach(this.ctx, fx.depthGains[ch][s].gain, depth, 0.04);
        }
        approach(this.ctx, fx.fbs[ch].gain, Math.min(MAX_PHASER_FEEDBACK, color), 0.03);
      }
    } else if (fx.kind === "tremolo") {
      const m = depth * 0.5;
      const shape = clamp01(color);
      const w = clamp01(width);
      approach(this.ctx, fx.raw.gain, 1 - shape, 0.03);
      approach(this.ctx, fx.shaped.gain, shape, 0.03);
      approach(this.ctx, fx.depthL.gain, m, 0.03);
      approach(this.ctx, fx.depthR.gain, m * (1 - 2 * w), 0.03);
      approach(this.ctx, fx.gL.gain, 1 - m, 0.03);
      approach(this.ctx, fx.gR.gain, 1 - m, 0.03);
    }
    this.applyBlend(this.shells.mod, pedal.enabled, p.mix);
  }

  applyFilter(pedal) {
    const p = pedal.params;
    const type = pedal.type;
    const fx = this.shells.filter.fx;
    this.liveFilter = pedal;
    const base = mapParam("filter", "freq", p.freq, type);
    const q = mapParam("filter", "resonance", p.resonance, type);
    const biquadType = type === "highpass" ? "highpass" : type === "wah" ? "bandpass" : "lowpass";
    for (let i = 0; i < fx.filters.length; i++) {
      if (fx.filters[i].type !== biquadType) fx.filters[i].type = biquadType;
      approach(this.ctx, fx.filters[i].frequency, base, 0.03);
      approach(this.ctx, fx.filters[i].Q, q, 0.03);
    }
    if (type === "wah") {
      approach(this.ctx, fx.lfo.frequency, 0.2, 0.05);
      approach(this.ctx, fx.lfoDepth.gain, 0, 0.03);
      this.pushEnvelope(p, true);
    } else {
      const rate = mapParam("filter", "rate", p.rate, type);
      const swing = mapParam("filter", "depth", p.depth, type) * base * 0.75;
      approach(this.ctx, fx.lfo.frequency, rate, 0.03);
      approach(this.ctx, fx.lfoDepth.gain, swing, 0.04);
      this.pushEnvelope(p, false);
    }
    this.applyBlend(this.shells.filter, pedal.enabled, p.mix == null ? 1 : p.mix);
  }

  pushEnvelope(params, wah) {
    const depth = wah ? mapParam("filter", "depth", params.depth, "wah") : 0;
    const range = wah ? mapParam("filter", "range", params.freq, "wah") : 0;
    const attack = mapParam("filter", "rate", params.rate, "wah");
    const release = mapParam("filter", "release", params.release == null ? 0.4 : params.release, "wah");
    if (this.envNode) {
      const now = this.ctx.currentTime;
      approach(this.ctx, this.envNode.parameters.get("depth"), depth, 0.03);
      approach(this.ctx, this.envNode.parameters.get("range"), range, 0.03);
      approach(this.ctx, this.envNode.parameters.get("attack"), attack, 0.03);
      approach(this.ctx, this.envNode.parameters.get("release"), release, 0.03);
      this._envAttack = attack;
      this._envRelease = release;
      this._envDepth = depth;
      this._envRange = range;
    } else {
      this._envAttack = attack;
      this._envRelease = release;
      this._envDepth = depth;
      this._envRange = range;
    }
  }

  applyDelay(pedal) {
    const p = pedal.params;
    const fx = this.shells.delay.fx;
    const time = clamp(mapParam("delay", "time", p.time), 0.04, 1);
    const fb = Math.min(MAX_DELAY_FEEDBACK, mapParam("delay", "feedback", p.feedback));
    const tone = mapParam("delay", "tone", p.tone);
    const low = mapParam("delay", "lowCut", p.lowCut);
    const mod = mapParam("delay", "modDepth", p.modDepth);
    const rate = mapParam("delay", "modRate", p.modRate);
    approach(this.ctx, fx.lfo.frequency, rate, 0.05);
    for (let i = 0; i < 2; i++) {
      approach(this.ctx, fx.delays[i].delayTime, time, 0.04);
      approach(this.ctx, fx.fbs[i].gain, fb, 0.03);
      approach(this.ctx, fx.tones[i].frequency, tone, 0.04);
      approach(this.ctx, fx.lows[i].frequency, low, 0.04);
      approach(this.ctx, fx.depths[i].gain, mod, 0.04);
    }
    this.applyBlend(this.shells.delay, pedal.enabled, p.mix);
  }

  applyReverb(pedal) {
    const p = pedal.params;
    const type = pedal.type;
    this.reverbType = type;
    const t60 = mapParam("reverb", "decay", p.decay);
    const cutoff = mapParam("reverb", "tone", p.tone);
    const pre = mapParam("reverb", "predelay", p.predelay);
    const width = mapParam("reverb", "width", p.width);
    const mod = mapParam("reverb", "mod", p.mod);
    const size = mapParam("reverb", "size", p.size);
    const fx = this.shells.reverb.fx;
    if (fx.mode === "worklet") {
      const par = fx.node.parameters;
      const now = this.ctx.currentTime;
      const typeParam = par.get("type");
      typeParam.cancelScheduledValues(now);
      typeParam.setValueAtTime(reverbTypeIndex(type), now);
      approach(this.ctx, par.get("t60"), t60, 0.04);
      approach(this.ctx, par.get("cutoff"), cutoff, 0.04);
      approach(this.ctx, par.get("predelay"), pre, 0.04);
      approach(this.ctx, par.get("width"), width, 0.04);
      approach(this.ctx, par.get("mod"), mod, 0.04);
      approach(this.ctx, par.get("size"), size, 0.08);
    } else {
      this.irParams = { t60, cutoff, predelay: pre, width, mod, size, type };
      clearTimeout(this.irTimer);
      this.irTimer = setTimeout(() => this.swapImpulse(), 70);
    }
    this.applyBlend(this.shells.reverb, pedal.enabled, p.mix);
  }

  swapImpulse() {
    if (!this.irParams || !this.shells.reverb || this.shells.reverb.fx.mode !== "convolver") return;
    const ctx = this.ctx;
    const sr = ctx.sampleRate;
    const seconds = Math.min(4.5, Math.max(1.2, this.irParams.t60 * 1.15));
    const n = Math.floor(sr * seconds);
    const rev = new ReverbCore(sr);
    rev.setControls(this.irParams);
    const L = new Float32Array(n);
    const R = new Float32Array(n);
    const block = 128;
    const inp = new Float32Array(block);
    inp[0] = 1;
    for (let i = 0; i < n; i += block) {
      const len = Math.min(block, n - i);
      rev.process(inp.subarray(0, len), L.subarray(i, i + len), R.subarray(i, i + len));
      if (i === 0) inp[0] = 0;
    }
    let peak = 0;
    for (let i = 0; i < n; i++) {
      const a = Math.abs(L[i]);
      const b = Math.abs(R[i]);
      if (a > peak) peak = a;
      if (b > peak) peak = b;
    }
    const norm = peak > 0.0001 ? 0.85 / peak : 1;
    for (let i = 0; i < n; i++) {
      L[i] *= norm;
      R[i] *= norm;
    }
    const buffer = ctx.createBuffer(2, n, sr);
    buffer.copyToChannel(L, 0);
    buffer.copyToChannel(R, 1);
    const fx = this.shells.reverb.fx;
    const next = fx.active ? 0 : 1;
    const conv = next ? fx.b : fx.a;
    const gain = next ? fx.gB : fx.gA;
    const prev = next ? fx.gA : fx.gB;
    conv.buffer = buffer;
    approach(ctx, gain.gain, 1, 0.03);
    approach(ctx, prev.gain, 0, 0.05);
    fx.active = next;
  }

  setInputGain(value) {
    if (!this.ctx) return;
    approach(this.ctx, this.inputGain.gain, clamp(value, 0, INPUT_GAIN_MAX), 0.02);
  }

  setMaster(value) {
    if (!this.ctx) return;
    approach(this.ctx, this.master.gain, clamp01(value), 0.02);
  }

  setOrder(order) {
    this.order = order.slice();
    if (!this.ctx || !this.duck) return;
    if (!this.running) {
      this.reconnectNow();
      return;
    }
    approach(this.ctx, this.duck.gain, 0, 0.005);
    clearTimeout(this.reTimer);
    this.reTimer = setTimeout(() => {
      this.reconnectNow();
      if (this.ctx) approach(this.ctx, this.duck.gain, 1, 0.012);
    }, 22);
  }

  reconnectNow() {
    try { this.chainIn.disconnect(); } catch (err) { /* fresh */ }
    for (let i = 0; i < PEDAL_IDS.length; i++) {
      try { this.shells[PEDAL_IDS[i]].output.disconnect(); } catch (err) { /* fresh */ }
    }
    let prev = this.chainIn;
    for (let i = 0; i < this.order.length; i++) {
      const shell = this.shells[this.order[i]];
      prev.connect(shell.input);
      prev = shell.output;
    }
    prev.connect(this.duck);
  }

  async applySource(source, deviceId) {
    if (source !== "guitar") {
      this.leaveGuitar();
      return;
    }
    await this.useGuitar(deviceId);
  }

  async openMic(deviceId) {
    const stream = await this.requestMic(deviceId);
    if (this.micNode) {
      try { this.micNode.disconnect(); } catch (err) { /* already */ }
    }
    if (this.micStream) this.micStream.getTracks().forEach((t) => t.stop());
    this.micStream = stream;
    this.micNode = this.ctx.createMediaStreamSource(stream);
    this.micNode.connect(this.micGain);
    if (navigator.mediaDevices && navigator.mediaDevices.enumerateDevices && this.onDevices) {
      try {
        const all = await navigator.mediaDevices.enumerateDevices();
        this.onDevices(all.filter((d) => d.kind === "audioinput"));
      } catch (err) { /* labels can wait */ }
    }
  }

  async requestMic(deviceId) {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      throw new Error("This browser has no microphone input.");
    }
    const attempts = [];
    const first = {
      echoCancellation: false,
      noiseSuppression: false,
      autoGainControl: false,
      channelCount: 1,
      latency: 0,
    };
    if (deviceId) first.deviceId = { exact: deviceId };
    attempts.push(first);
    const second = {
      echoCancellation: false,
      noiseSuppression: false,
      autoGainControl: false,
    };
    if (deviceId) second.deviceId = { exact: deviceId };
    attempts.push(second);
    if (deviceId) {
      attempts.push({
        echoCancellation: false,
        noiseSuppression: false,
        autoGainControl: false,
      });
    }
    this.attempts = attempts;
    let lastErr = null;
    for (let i = 0; i < attempts.length; i++) {
      this.constraints = attempts[i];
      try {
        return await navigator.mediaDevices.getUserMedia({ audio: attempts[i], video: false });
      } catch (err) {
        lastErr = err;
      }
    }
    throw lastErr || new Error("Microphone permission was blocked.");
  }

  stopMic() {
    if (this.micNode) {
      try { this.micNode.disconnect(); } catch (err) { /* already */ }
      this.micNode = null;
    }
    if (this.micStream) {
      this.micStream.getTracks().forEach((t) => t.stop());
      this.micStream = null;
    }
  }

  startTest() {
    if (this.testLive) return;
    this.testLive = true;
    this.nextBeat = this.ctx.currentTime + 0.06;
    this.step = 0;
    const loop = () => {
      if (!this.testLive || !this.ctx) return;
      const spb = 60 / 78;
      while (this.nextBeat < this.ctx.currentTime + 0.14) {
        this.fireBeat(this.nextBeat, this.step % 4);
        this.nextBeat += spb;
        this.step++;
      }
      this.testTimer = setTimeout(loop, 25);
    };
    loop();
  }

  stopTest() {
    this.testLive = false;
    clearTimeout(this.testTimer);
    this.testTimer = null;
  }

  playOnce(spec) {
    if (!this.ctx) return;
    const freq = noteFrequency(spec.note, spec.octave);
    if (spec.sound === "chord") this.strum(this.ctx.currentTime + 0.02, majorChordFrequencies(freq), 0.16);
    else if (spec.sound === "tone") this.blipTone(freq, 2.1);
    else if (spec.sound === "loop") this.playLoopOnce();
    else this.pluck(this.ctx.currentTime + 0.02, freq, 0.28);
  }

  playDown(spec) {
    this.stopRepeat();
    if (spec.sound === "tone") {
      this.stopTest();
      this.beginTone(noteFrequency(spec.note, spec.octave));
      return;
    }
    if (spec.sound === "loop" && spec.repeat) {
      this.startTest();
      return;
    }
    this.stopTest();
    this.playOnce(spec);
    if (spec.repeat) this.armRepeat(spec);
  }

  playUp(spec, heldMs) {
    if (spec.sound !== "tone") return;
    if (heldMs < 280) this.scheduleToneEnd(2.1);
    else this.releaseTone(0.15);
    if (spec.repeat) this.armRepeat(spec);
  }

  armRepeat(spec) {
    this.repeatSpec = {
      sound: spec.sound,
      note: spec.note,
      octave: spec.octave,
      repeat: true,
    };
    if (this.repeatTimer) return;
    this.repeatTimer = setInterval(() => {
      if (!this.repeatSpec || !this.ctx) return;
      if (this.repeatSpec.sound === "loop") return;
      this.playOnce(this.repeatSpec);
    }, 2400);
  }

  updateRepeat(spec) {
    if (!this.repeatSpec) return;
    this.repeatSpec = {
      sound: spec.sound,
      note: spec.note,
      octave: spec.octave,
      repeat: true,
    };
  }

  stopRepeat() {
    clearInterval(this.repeatTimer);
    this.repeatTimer = null;
    this.repeatSpec = null;
  }

  playLoopOnce() {
    this.stopTest();
    const spb = 60 / 78;
    const t0 = this.ctx.currentTime + 0.03;
    for (let i = 0; i < 4; i++) this.fireBeat(t0 + i * spb, i);
  }

  beginTone(freq) {
    this.releaseTone(0.02);
    const ctx = this.ctx;
    const osc = ctx.createOscillator();
    osc.type = "sawtooth";
    osc.frequency.value = freq;
    const filter = ctx.createBiquadFilter();
    filter.type = "lowpass";
    filter.frequency.value = 1400;
    const gain = ctx.createGain();
    const now = ctx.currentTime;
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.2, now + 0.03);
    osc.connect(filter);
    filter.connect(gain);
    gain.connect(this.testGain);
    osc.start(now);
    this.tone = { osc, filter, gain };
  }

  scheduleToneEnd(seconds) {
    clearTimeout(this.toneTimer);
    this.toneTimer = setTimeout(() => this.releaseTone(0.35), Math.max(0, seconds) * 1000);
  }

  blipTone(freq, seconds) {
    this.beginTone(freq);
    this.scheduleToneEnd(seconds);
  }

  releaseTone(fade) {
    clearTimeout(this.toneTimer);
    this.toneTimer = null;
    if (!this.tone || !this.ctx) {
      this.tone = null;
      return;
    }
    const fadeSec = fade == null ? 0.08 : fade;
    const now = this.ctx.currentTime;
    const gain = this.tone.gain.gain;
    const current = Math.max(0.0001, gain.value || 0.0001);
    gain.cancelScheduledValues(now);
    gain.setValueAtTime(current, now);
    gain.exponentialRampToValueAtTime(0.0001, now + Math.max(0.03, fadeSec));
    try { this.tone.osc.stop(now + fadeSec + 0.05); } catch (err) { /* already stopped */ }
    this.collect(now + fadeSec + 0.08, [this.tone.osc, this.tone.filter, this.tone.gain]);
    this.tone = null;
  }

  fireBeat(time, beat) {
    if (beat === 0) this.strum(time, [82.41, 123.47, 164.81, 207.65, 246.94, 329.63], 0.12);
    else if (beat === 2) this.strum(time, [164.81, 246.94, 329.63], 0.07);
    else this.snare(time);
  }

  strum(time, freqs, vel) {
    for (let i = 0; i < freqs.length; i++) this.pluck(time + i * 0.015, freqs[i], vel * (i < 2 ? 1 : 0.72));
  }

  pluck(time, freq, velocity) {
    const ctx = this.ctx;
    const sr = ctx.sampleRate;
    const period = sr / freq;
    const len = Math.max(8, Math.floor(period));
    const buffer = ctx.createBuffer(1, len, sr);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    const src = ctx.createBufferSource();
    src.buffer = buffer;
    const delay = ctx.createDelay(1);
    delay.delayTime.setValueAtTime(Math.min(0.9, period / sr), time);
    const filter = ctx.createBiquadFilter();
    filter.type = "lowpass";
    filter.frequency.setValueAtTime(1700 + velocity * 3000, time);
    const fb = ctx.createGain();
    fb.gain.setValueAtTime(freq < 140 ? 0.962 : 0.944, time);
    const out = ctx.createGain();
    out.gain.setValueAtTime(Math.max(0.0002, velocity), time);
    out.gain.exponentialRampToValueAtTime(0.0001, time + 2.15);
    src.connect(delay);
    delay.connect(filter);
    filter.connect(fb);
    fb.connect(delay);
    filter.connect(out);
    out.connect(this.testGain);
    src.start(time);
    src.stop(time + 0.04);
    this.collect(time + 2.35, [src, delay, filter, fb, out]);
  }

  snare(time) {
    const ctx = this.ctx;
    const dur = 0.15;
    const n = Math.max(8, Math.floor(ctx.sampleRate * dur));
    const buffer = ctx.createBuffer(1, n, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < n; i++) data[i] = Math.random() * 2 - 1;
    const src = ctx.createBufferSource();
    src.buffer = buffer;
    const bp = ctx.createBiquadFilter();
    bp.type = "bandpass";
    bp.frequency.setValueAtTime(1850, time);
    bp.Q.setValueAtTime(0.75, time);
    const hp = ctx.createBiquadFilter();
    hp.type = "highpass";
    hp.frequency.setValueAtTime(900, time);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.38, time);
    g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
    const osc = ctx.createOscillator();
    osc.type = "triangle";
    osc.frequency.setValueAtTime(175, time);
    osc.frequency.exponentialRampToValueAtTime(80, time + 0.08);
    const og = ctx.createGain();
    og.gain.setValueAtTime(0.22, time);
    og.gain.exponentialRampToValueAtTime(0.0001, time + 0.09);
    src.connect(bp);
    bp.connect(hp);
    hp.connect(g);
    g.connect(this.testGain);
    osc.connect(og);
    og.connect(this.testGain);
    src.start(time);
    src.stop(time + dur);
    osc.start(time);
    osc.stop(time + 0.1);
    this.collect(time + 0.4, [src, bp, hp, g, osc, og]);
  }

  collect(when, nodes) {
    const ms = Math.max(40, (when - this.ctx.currentTime) * 1000 + 60);
    const timer = setTimeout(() => {
      for (let i = 0; i < nodes.length; i++) {
        try { nodes[i].disconnect(); } catch (err) { /* gone */ }
      }
    }, ms);
    this.noteTimers.push(timer);
    if (this.noteTimers.length > 48) clearTimeout(this.noteTimers.shift());
  }

  tick() {
    if (!this.running || !this.analyser) return;
    this.analyser.getFloatTimeDomainData(this.buf);
    let s = 0;
    let peak = 0;
    const buf = this.buf;
    for (let i = 0; i < buf.length; i++) {
      const a = buf[i] < 0 ? -buf[i] : buf[i];
      if (a > peak) peak = a;
      s += buf[i] * buf[i];
    }
    const rms = Math.sqrt(s / buf.length);
    this.meter += (rms - this.meter) * 0.45;
    if (this.meter > this.peakMeter) this.peakMeter = this.meter;
    if (peak > this.displayPeak) this.displayPeak = peak;
    else this.displayPeak *= 0.993;
    if (!this.envNode && this.liveFilter && this.liveFilter.type === "wah" && this.liveFilter.enabled && this._envDepth > 0) {
      this.follower.process(buf, this.envOut, this._envAttack || 0.02, this._envRelease || 0.15, this._envDepth, this._envRange || 0);
      const add = this.envOut[this.envOut.length - 1] || 0;
      const base = mapParam("filter", "freq", this.liveFilter.params.freq, "wah");
      const fx = this.shells.filter.fx;
      approach(this.ctx, fx.filters[0].frequency, base + add, 0.02);
      approach(this.ctx, fx.filters[1].frequency, base + add, 0.02);
    }
    if (this.onMeter) this.onMeter(this.displayPeak || rms);
    this.raf = requestAnimationFrame(() => this.tick());
  }
}

const engine = new Engine();

;
// Pedalboard UI. Audio stays in engine.js; this file only holds state and DOM.

let state = loadState();
let saveTimer = 0;
let taps = [];
let drag = null;

function loadState() {
  try {
    const raw = localStorage.getItem(storageKeyFor(APP_CONFIG.name));
    if (!raw) return initialState();
    return hydrate(JSON.parse(raw));
  } catch (err) {
    return initialState();
  }
}

function saveNow() {
  clearTimeout(saveTimer);
  try {
    localStorage.setItem(storageKeyFor(APP_CONFIG.name), JSON.stringify(serialize(state)));
  } catch (err) { /* private mode */ }
}

function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveNow, 40);
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function setStatus(text) {
  document.getElementById("status").textContent = text || "";
}

function readKnob(pedal, param) {
  if (pedal === "global") return param === "input" ? state.inputGain / INPUT_GAIN_MAX : state.master;
  return state.pedals[pedal].params[param];
}

function knobText(pedal, param, knob) {
  if (pedal === "global") return param === "input" ? formatGainDb(state.inputGain) : Math.round(state.master * 100) + "%";
  return formatParam(pedal, param, knob, state.pedals[pedal].type);
}

function knobLabel(pedal, param) {
  if (pedal === "global") return param === "input" ? "Input" : "Master";
  return paramLabel(pedal, param, state.pedals[pedal].type);
}

function paintFromState() {
  const knobs = document.querySelectorAll(".knob");
  for (let i = 0; i < knobs.length; i++) {
    const el = knobs[i];
    const pedal = el.dataset.pedal;
    const param = el.dataset.param;
    const knob = readKnob(pedal, param);
    const text = knobText(pedal, param, knob);
    const label = knobLabel(pedal, param);
    el.style.setProperty("--p", String(clamp01(knob)));
    const valueEl = el.querySelector(".knob-value");
    const labelEl = el.querySelector(".knob-label");
    if (valueEl) valueEl.textContent = text;
    if (labelEl) labelEl.textContent = label;
    el.setAttribute("aria-valuenow", String(Math.round(clamp01(knob) * 100)));
    el.setAttribute("aria-valuetext", text);
    el.setAttribute("aria-label", label);
  }
}

let meterHold = 0;

function paintMeter(rms) {
  const pct = Math.round(meterPercent(rms) * 100);
  meterHold = Math.max(pct, meterHold * 0.97);
  const shown = Math.round(meterHold);
  const fill = document.getElementById("meterFill");
  fill.style.width = shown + "%";
  fill.dataset.hot = shown > 92 ? "hot" : shown > 75 ? "warm" : "";
  document.getElementById("meter").setAttribute("aria-valuenow", String(shown));
}

function highlightPreset() {
  const buttons = document.querySelectorAll("[data-preset]");
  for (let i = 0; i < buttons.length; i++) {
    const on = buttons[i].dataset.preset === state.preset;
    buttons[i].setAttribute("aria-pressed", String(on));
    buttons[i].classList.toggle("on", on);
  }
}

function playerSpec() {
  return {
    sound: state.player.sound,
    note: state.player.note,
    octave: state.player.octave,
    repeat: state.player.repeat,
  };
}

function paintPlayer() {
  const player = state.player;
  const guitar = state.source === "guitar";
  document.getElementById("player").hidden = guitar;
  document.getElementById("guitarBox").hidden = !guitar;
  document.getElementById("useGuitarNow").hidden = !!engine.micStream;
  document.getElementById("noteReadout").textContent = player.note + player.octave;
  document.getElementById("octaveDown").disabled = player.octave <= 2;
  document.getElementById("octaveUp").disabled = player.octave >= 5;
  const notes = document.querySelectorAll("#notes button");
  for (let i = 0; i < notes.length; i++) {
    const on = notes[i].dataset.note === player.note;
    notes[i].classList.toggle("on", on);
    notes[i].setAttribute("aria-pressed", String(on));
  }
  const sounds = document.querySelectorAll("#sounds button");
  for (let i = 0; i < sounds.length; i++) {
    const on = sounds[i].dataset.sound === player.sound;
    sounds[i].classList.toggle("on", on);
    sounds[i].setAttribute("aria-pressed", String(on));
  }
  const repeat = document.getElementById("repeat");
  repeat.classList.toggle("on", player.repeat);
  repeat.setAttribute("aria-pressed", String(player.repeat));
  if (engine.repeatSpec) engine.updateRepeat(playerSpec());
}

function renderPlayer() {
  document.getElementById("notes").innerHTML = NOTE_NAMES.map((name) =>
    '<button type="button" data-note="' + name + '">' + name + "</button>"
  ).join("");
  document.getElementById("sounds").innerHTML = TEST_SOUNDS.map((id) =>
    '<button type="button" data-sound="' + id + '">' + TEST_SOUND_LABELS[id] + "</button>"
  ).join("");
  paintPlayer();
}

function chainLabel() {
  document.getElementById("chainLabel").textContent = chainText(state);
}

function nudgeGlyphs() {
  const board = document.getElementById("board");
  if (!board) return;
  board.classList.toggle("horizontal", window.matchMedia("(min-width: 900px)").matches);
}

function knobMarkup(pedal, param, extra) {
  const knob = clamp01(readKnob(pedal, param));
  const label = knobLabel(pedal, param);
  const text = knobText(pedal, param, knob);
  return '<div class="knob" data-pedal="' + pedal + '" data-param="' + param + '" role="slider" tabindex="0" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + Math.round(knob * 100) + '" aria-valuetext="' + esc(text) + '" aria-label="' + esc(label) + '" style="--p:' + knob + '">'
    + '<div class="knob-ring"><div class="knob-dial"><span class="pointer"></span></div></div>'
    + '<div class="knob-value">' + esc(text) + "</div>"
    + '<div class="knob-label">' + esc(label) + "</div>"
    + (extra || "")
    + "</div>";
}

function renderBoard() {
  const board = document.getElementById("board");
  if (!state.order.length) {
    board.innerHTML = '<p class="empty">Add a pedal to the chain.</p>';
    return;
  }
  const html = [];
  for (let i = 0; i < state.order.length; i++) {
    const id = state.order[i];
    const spec = PEDALS[id];
    const pedal = state.pedals[id];
    const chips = spec.types ? '<div class="chips" role="group" aria-label="' + esc(spec.name) + ' type">' + spec.types.map((t) => {
      const on = t.id === pedal.type;
      return '<button type="button" class="chip' + (on ? " on" : "") + '" data-type="' + t.id + '" aria-pressed="' + on + '">' + esc(t.label) + "</button>";
    }).join("") + "</div>" : "";
    const main = spec.main.map((param) => knobMarkup(id, param, spec.tap && param === "time" ? '<button type="button" class="tap">Tap</button>' : "")).join("");
    const more = spec.more.map((param) => knobMarkup(id, param)).join("");
    html.push(
      '<article class="pedal c-' + id + (pedal.enabled ? " engaged" : "") + '" data-id="' + id + '">'
      + '<i class="screw s1"></i><i class="screw s2"></i><i class="screw s3"></i>'
      + '<header class="pedal-top">'
      + '<span class="drag" aria-hidden="true">⋮⋮</span>'
      + "<h2>" + esc(spec.name) + "</h2>"
      + '<button type="button" class="stomp' + (pedal.enabled ? " on" : "") + '" aria-pressed="' + pedal.enabled + '" aria-label="' + esc(spec.name) + (pedal.enabled ? " on" : " off") + '"><span class="led"></span></button>'
      + "</header>"
      + '<div class="face">' + chips
      + '<div class="knobs knobs-' + spec.main.length + '">' + main + "</div>"
      + '<div class="more-panel"' + (pedal.more ? "" : " hidden") + '><div class="knobs knobs-' + spec.more.length + '">' + more + "</div></div>"
      + "</div>"
      + '<footer class="pedal-foot">'
      + '<button type="button" class="more-btn" aria-expanded="' + pedal.more + '">' + (pedal.more ? "Less" : "More") + "</button>"
      + '<div class="nudges">'
      + '<button type="button" class="nudge" data-dir="-1" aria-label="Move ' + esc(spec.name) + ' earlier"' + (i === 0 ? " disabled" : "") + '><span class="chev"></span></button>'
      + '<button type="button" class="nudge" data-dir="1" aria-label="Move ' + esc(spec.name) + ' later"' + (i === state.order.length - 1 ? " disabled" : "") + '><span class="chev"></span></button>'
      + "</div>"
      + '<button type="button" class="remove">Remove</button>'
      + "</footer></article>"
    );
  }
  board.innerHTML = html.join("");
  nudgeGlyphs();
  paintFromState();
}

function renderAdd() {
  const row = document.getElementById("addRow");
  const missing = PEDAL_IDS.filter((id) => state.order.indexOf(id) === -1);
  if (!missing.length) {
    row.innerHTML = '<span class="add-all">All pedals are on the board.</span>';
    return;
  }
  row.innerHTML = missing.map((id) => '<button type="button" data-add="' + id + '">Add ' + esc(PEDALS[id].name) + "</button>").join("");
}

function renderPresets() {
  document.getElementById("presets").innerHTML = PRESETS.map((p) =>
    '<button type="button" data-preset="' + p.id + '" aria-pressed="false">' + esc(p.name) + "</button>"
  ).join("");
  highlightPreset();
}

function writeKnob(pedal, param, value) {
  const v = clamp01(value);
  if (pedal === "global") {
    if (param === "input") {
      state.inputGain = v * INPUT_GAIN_MAX;
      if (engine.ctx) engine.setInputGain(state.inputGain);
    } else {
      state.master = v;
      if (engine.ctx) engine.setMaster(state.master);
    }
  } else {
    state.pedals[pedal].params[param] = v;
    state.preset = null;
    highlightPreset();
    if (engine.ctx) engine.setPedal(pedal, state.pedals[pedal], false);
  }
  paintFromState();
  scheduleSave();
}

function commitOrder(next) {
  if (next.join("|") === state.order.join("|")) return;
  state.order = next;
  for (let i = 0; i < PEDAL_IDS.length; i++) {
    state.pedals[PEDAL_IDS[i]].onBoard = next.indexOf(PEDAL_IDS[i]) !== -1;
  }
  state.preset = null;
  highlightPreset();
  const board = document.getElementById("board");
  const have = [];
  const cards = board.querySelectorAll(".pedal");
  for (let i = 0; i < cards.length; i++) have.push(cards[i].dataset.id);
  const same = have.length === next.length && next.every((id) => have.indexOf(id) !== -1);
  if (same) {
    for (let i = 0; i < next.length; i++) {
      const el = board.querySelector('.pedal[data-id="' + next[i] + '"]');
      if (el) board.appendChild(el);
    }
    const ordered = board.querySelectorAll(".pedal");
    for (let i = 0; i < ordered.length; i++) {
      const prev = ordered[i].querySelector('[data-dir="-1"]');
      const nxt = ordered[i].querySelector('[data-dir="1"]');
      if (prev) prev.disabled = i === 0;
      if (nxt) nxt.disabled = i === ordered.length - 1;
    }
  } else {
    renderBoard();
  }
  chainLabel();
  if (engine.ctx) engine.setOrder(next);
  scheduleSave();
}

function fillDevices(list) {
  const sel = document.getElementById("device");
  const current = state.deviceId;
  sel.replaceChildren();
  const def = document.createElement("option");
  def.value = "";
  def.textContent = "Default microphone";
  sel.appendChild(def);
  const devices = list || [];
  for (let i = 0; i < devices.length; i++) {
    const o = document.createElement("option");
    o.value = devices[i].deviceId;
    o.textContent = devices[i].label || "Microphone";
    sel.appendChild(o);
  }
  const known = [...sel.options].some((o) => o.value === current);
  sel.value = known ? current : "";
}

let playDownAt = 0;
let noteHeld = false;
let pressId = 0;

async function playDown() {
  const id = ++pressId;
  noteHeld = true;
  playDownAt = performance.now();
  engine.ensureContext();
  try {
    await engine.prepare(state);
    if (id !== pressId) return;
    if (state.player.sound === "tone" && !noteHeld) engine.playOnce(playerSpec());
    else engine.playDown(playerSpec());
    setStatus("");
  } catch (err) {
    setStatus("Audio didn't start. Tap Play note again.");
  }
}

function playUp() {
  noteHeld = false;
  if (!engine.tone || state.player.sound !== "tone") return;
  engine.playUp(playerSpec(), performance.now() - playDownAt);
}

async function useGuitar() {
  engine.ensureContext();
  try {
    await engine.prepare(state);
    await engine.useGuitar(state.deviceId);
    state.source = "guitar";
    saveNow();
    paintPlayer();
    setStatus("Guitar is on.");
  } catch (err) {
    state.source = "test";
    if (engine.ctx) engine.leaveGuitar();
    paintPlayer();
    setStatus("The browser didn't allow the microphone. You can still play notes.");
  }
}

function showNotes() {
  state.source = "test";
  if (engine.ctx) engine.leaveGuitar();
  paintPlayer();
  saveNow();
  setStatus("");
}

function choosePreset(id) {
  state = applyPreset(state, id);
  if (engine.ctx) engine.sync(state, true);
  renderBoard();
  renderAdd();
  chainLabel();
  highlightPreset();
  paintFromState();
  saveNow();
}

function addPedal(id) {
  if (state.order.indexOf(id) !== -1) return;
  state.order = state.order.concat(id);
  state.pedals[id].onBoard = true;
  state.pedals[id].enabled = true;
  state.preset = null;
  if (engine.ctx) {
    engine.setPedal(id, state.pedals[id], false);
    engine.setOrder(state.order);
  }
  renderBoard();
  renderAdd();
  chainLabel();
  highlightPreset();
  scheduleSave();
}

function removePedal(id) {
  state.order = state.order.filter((x) => x !== id);
  state.pedals[id].onBoard = false;
  state.pedals[id].enabled = false;
  state.preset = null;
  if (engine.ctx) {
    engine.setPedal(id, state.pedals[id], false);
    engine.setOrder(state.order);
  }
  renderBoard();
  renderAdd();
  chainLabel();
  highlightPreset();
  scheduleSave();
}

function setType(id, type) {
  if (!validType(id, type) || state.pedals[id].type === type) return;
  state.pedals[id].type = type;
  state.preset = null;
  if (engine.ctx) engine.setPedal(id, state.pedals[id], true);
  renderBoard();
  chainLabel();
  highlightPreset();
  scheduleSave();
}

function doTap() {
  const now = performance.now();
  if (!taps.length || now - taps[taps.length - 1] > 2000) taps = [];
  taps.push(now);
  if (taps.length > 4) taps.shift();
  if (taps.length < 2) return;
  let sum = 0;
  for (let i = 1; i < taps.length; i++) sum += taps[i] - taps[i - 1];
  writeKnob("delay", "time", knobFromDelaySeconds(sum / (taps.length - 1) / 1000));
}

function dropIndex(id, x, y) {
  const board = document.getElementById("board");
  const cards = [...board.querySelectorAll(".pedal")].filter((el) => el.dataset.id !== id);
  const horizontal = getComputedStyle(board).flexDirection === "row";
  const pos = horizontal ? x : y;
  for (let i = 0; i < cards.length; i++) {
    const r = cards[i].getBoundingClientRect();
    const mid = horizontal ? r.left + r.width / 2 : r.top + r.height / 2;
    if (pos < mid) return i;
  }
  return cards.length;
}

function init() {
  document.title = APP_CONFIG.name;
  const title = document.getElementById("appTitle");
  title.textContent = APP_CONFIG.name;
  const apple = document.querySelector('meta[name="apple-mobile-web-app-title"]');
  if (apple) apple.setAttribute("content", APP_CONFIG.name);

  document.getElementById("inputSlot").innerHTML = knobMarkup("global", "input");
  document.getElementById("masterSlot").innerHTML = knobMarkup("global", "master");
  renderPresets();
  renderBoard();
  renderAdd();
  chainLabel();
  renderPlayer();
  paintFromState();
  fillDevices([]);

  engine.onMeter = paintMeter;
  engine.onDevices = (list) => {
    fillDevices(list);
    paintPlayer();
  };

  const playNote = document.getElementById("playNote");
  playNote.addEventListener("pointerdown", (e) => {
    if (e.button != null && e.button !== 0) return;
    e.preventDefault();
    playNote.classList.add("is-down");
    try { playNote.setPointerCapture(e.pointerId); } catch (err) { /* keyboard */ }
    playDown();
  });
  playNote.addEventListener("pointerup", () => {
    playNote.classList.remove("is-down");
    playUp();
  });
  playNote.addEventListener("pointercancel", () => {
    playNote.classList.remove("is-down");
    playUp();
  });
  playNote.addEventListener("keydown", (e) => {
    if (e.key !== "Enter" && e.key !== " ") return;
    if (e.repeat) return;
    e.preventDefault();
    playNote.classList.add("is-down");
    playDown();
  });
  playNote.addEventListener("keyup", (e) => {
    if (e.key !== "Enter" && e.key !== " ") return;
    playNote.classList.remove("is-down");
    playUp();
  });

  document.getElementById("notes").addEventListener("click", (e) => {
    const btn = e.target.closest("[data-note]");
    if (!btn) return;
    state.player.note = btn.dataset.note;
    paintPlayer();
    scheduleSave();
  });
  document.getElementById("octaveDown").addEventListener("click", () => {
    state.player.octave = Math.max(2, state.player.octave - 1);
    paintPlayer();
    scheduleSave();
  });
  document.getElementById("octaveUp").addEventListener("click", () => {
    state.player.octave = Math.min(5, state.player.octave + 1);
    paintPlayer();
    scheduleSave();
  });
  document.getElementById("sounds").addEventListener("click", (e) => {
    const btn = e.target.closest("[data-sound]");
    if (!btn) return;
    state.player.sound = btn.dataset.sound;
    engine.stopRepeat();
    engine.stopTest();
    paintPlayer();
    scheduleSave();
  });
  document.getElementById("repeat").addEventListener("click", () => {
    state.player.repeat = !state.player.repeat;
    if (!state.player.repeat) engine.stopRepeat();
    paintPlayer();
    scheduleSave();
  });
  document.getElementById("useGuitar").addEventListener("click", useGuitar);
  document.getElementById("useGuitarNow").addEventListener("click", useGuitar);
  document.getElementById("playNotes").addEventListener("click", showNotes);
  document.getElementById("presets").addEventListener("click", (e) => {
    const btn = e.target.closest("[data-preset]");
    if (btn) choosePreset(btn.dataset.preset);
  });
  document.getElementById("device").addEventListener("change", async (e) => {
    state.deviceId = e.target.value;
    scheduleSave();
    if (state.source === "guitar" && engine.micStream) {
      engine.ensureContext();
      try {
        await engine.prepare(state);
        await engine.openMic(state.deviceId);
        setStatus("Guitar is on.");
      } catch (err) {
        setStatus("Couldn't open that input.");
      }
    }
  });
  document.getElementById("addRow").addEventListener("click", (e) => {
    const btn = e.target.closest("[data-add]");
    if (btn) addPedal(btn.dataset.add);
  });

  const board = document.getElementById("board");
  board.addEventListener("click", (e) => {
    const card = e.target.closest(".pedal");
    if (!card) return;
    const id = card.dataset.id;
    if (e.target.closest(".stomp")) {
      const pedal = state.pedals[id];
      pedal.enabled = !pedal.enabled;
      state.preset = null;
      card.classList.toggle("engaged", pedal.enabled);
      const stomp = card.querySelector(".stomp");
      stomp.classList.toggle("on", pedal.enabled);
      stomp.setAttribute("aria-pressed", String(pedal.enabled));
      stomp.setAttribute("aria-label", PEDALS[id].name + (pedal.enabled ? " on" : " off"));
      highlightPreset();
      if (engine.ctx) engine.setPedal(id, pedal, false);
      scheduleSave();
      return;
    }
    const chip = e.target.closest(".chip");
    if (chip) { setType(id, chip.dataset.type); return; }
    if (e.target.closest(".more-btn")) {
      state.pedals[id].more = !state.pedals[id].more;
      renderBoard();
      scheduleSave();
      return;
    }
    const nudge = e.target.closest(".nudge");
    if (nudge && !nudge.disabled) {
      const index = state.order.indexOf(id);
      commitOrder(moveItem(state.order, index, Number(nudge.dataset.dir)));
      return;
    }
    if (e.target.closest(".remove")) removePedal(id);
    if (e.target.closest(".tap")) doTap();
  });

  board.addEventListener("pointerdown", (e) => {
    if (e.button != null && e.button !== 0) return;
    const top = e.target.closest(".pedal-top");
    if (!top || e.target.closest("button")) return;
    const card = top.closest(".pedal");
    drag = { id: card.dataset.id, pointer: e.pointerId };
    top.setPointerCapture(e.pointerId);
  });
  board.addEventListener("pointermove", (e) => {
    if (!drag || e.pointerId !== drag.pointer) return;
    const target = dropIndex(drag.id, e.clientX, e.clientY);
    const next = reorder(state.order, drag.id, target);
    if (next.join("|") !== state.order.join("|")) commitOrder(next);
  });
  board.addEventListener("pointerup", (e) => {
    if (drag && e.pointerId === drag.pointer) drag = null;
  });
  board.addEventListener("pointercancel", () => { drag = null; });

  document.addEventListener("pointerdown", (e) => {
    if (e.target.closest && e.target.closest(".tap")) return;
    const el = e.target.closest && e.target.closest(".knob");
    if (!el) return;
    e.preventDefault();
    const pedal = el.dataset.pedal;
    const param = el.dataset.param;
    const start = readKnob(pedal, param);
    const x0 = e.clientX;
    const y0 = e.clientY;
    const move = (ev) => {
      const dy = y0 - ev.clientY;
      const dx = ev.clientX - x0;
      const delta = Math.abs(dx) > Math.abs(dy) ? dx : dy;
      const scale = ev.shiftKey ? 1 / 420 : 1 / 150;
      writeKnob(pedal, param, start + delta * scale);
    };
    const up = () => {
      window.removeEventListener("pointermove", move);
      window.removeEventListener("pointerup", up);
      window.removeEventListener("pointercancel", up);
    };
    window.addEventListener("pointermove", move);
    window.addEventListener("pointerup", up);
    window.addEventListener("pointercancel", up);
  });

  document.addEventListener("wheel", (e) => {
    const el = e.target.closest && e.target.closest(".knob");
    if (!el || (e.target.closest && e.target.closest(".tap"))) return;
    e.preventDefault();
    const dir = e.deltaY < 0 ? 1 : -1;
    writeKnob(el.dataset.pedal, el.dataset.param, readKnob(el.dataset.pedal, el.dataset.param) + dir * 0.03);
  }, { passive: false });

  document.addEventListener("keydown", (e) => {
    const el = e.target.closest && e.target.closest(".knob");
    if (!el) return;
    let delta = 0;
    if (e.key === "ArrowUp" || e.key === "ArrowRight") delta = e.shiftKey ? 0.01 : 0.02;
    else if (e.key === "ArrowDown" || e.key === "ArrowLeft") delta = e.shiftKey ? -0.01 : -0.02;
    else if (e.key === "PageUp") delta = 0.1;
    else if (e.key === "PageDown") delta = -0.1;
    else if (e.key === "Home") delta = -1;
    else if (e.key === "End") delta = 1;
    else return;
    e.preventDefault();
    const cur = readKnob(el.dataset.pedal, el.dataset.param);
    writeKnob(el.dataset.pedal, el.dataset.param, delta === 1 ? 1 : delta === -1 ? 0 : cur + delta);
  });

  window.matchMedia("(min-width: 900px)").addEventListener("change", nudgeGlyphs);
  window.addEventListener("pagehide", saveNow);
  if (navigator.mediaDevices && navigator.mediaDevices.addEventListener) {
    navigator.mediaDevices.addEventListener("devicechange", () => {
      if (!navigator.mediaDevices.enumerateDevices) return;
      navigator.mediaDevices.enumerateDevices().then((all) => {
        fillDevices(all.filter((d) => d.kind === "audioinput"));
      }).catch(() => {});
    });
  }

  window.__lab = {
    get state() { return state; },
    get meter() { return engine.meter; },
    get peakMeter() { return engine.peakMeter; },
    get running() { return engine.running; },
    get contextState() { return engine.ctx ? engine.ctx.state : "none"; },
    get constraints() { return engine.constraints; },
    get attempts() { return engine.attempts; },
    get reverbMode() { return engine.reverbMode; },
    APP_CONFIG,
  };
}

if (typeof document !== "undefined") init();

  </script>
</body>
</html>
